<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinguisPlay · 试玩</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #0d0d12; color: #e8e8ee; }
  /* immersive background layer + readability vignette */
  #bg { position: fixed; inset: 0; z-index: -2; background: linear-gradient(135deg,#15151c,#0d0d12); background-size: cover; background-position: center; transition: background-image .6s ease, background .6s ease; }
  #bg::after { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse at center, rgba(0,0,0,.15), rgba(0,0,0,.62)); }
  /* fixed-height app so ONLY #chat scrolls — header + cast + goal stay pinned on top */
  #app { max-width: 760px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: transparent; overflow: hidden; }
  /* the non-play screens (login / story list / role) scroll on their own if tall */
  #auth, #pick, #role { max-height: 100%; overflow-y: auto; }
  header { flex: 0 0 auto; padding: 12px 16px; border-bottom: 1px solid #23232c44; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: rgba(13,13,18,.55); backdrop-filter: blur(8px); z-index: 20; }
  header b { font-size: 15px; }
  .muted { color: #999; font-size: 12px; }
  .card { background: #16161dee; border: 1px solid #23232c; border-radius: 12px; padding: 20px; margin: 24px; }
  input, button, select { font: inherit; }
  input { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #0d0d12; color: #eee; }
  button { padding: 9px 14px; border: 0; border-radius: 8px; background: #5b6cff; color: #fff; cursor: pointer; font-weight: 600; }
  button.ghost { background: #23232c; color: #bbb; }
  button:disabled { opacity: .5; cursor: default; }
  .iconbtn { background: transparent; padding: 4px 6px; font-size: 16px; }
  #cast { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; border-bottom: 1px solid #23232c44; background: rgba(13,13,18,.45); }
  .castitem { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; opacity: .6; min-width: 46px; }
  .castitem.sel { opacity: 1; }
  .castitem.sel .av { box-shadow: 0 0 0 2px #8ea2ff; }
  .castitem small { font-size: 11px; color: #c9c9d4; white-space: nowrap; }
  #chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
  .row.left { align-self: flex-start; }
  .row.right { align-self: flex-end; flex-direction: row-reverse; }
  .av { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: #fff; box-shadow: 0 1px 4px #0006; }
  .bubble { padding: 9px 13px; border-radius: 13px; line-height: 1.65; white-space: pre-wrap; }
  .npc .bubble { background: #1c2030e6; border: 1px solid #2a3350; }
  .who { color: #8ea2ff; font-size: 12.5px; font-weight: 700; margin-bottom: 3px; }
  .npc .bubble .said { color: #eaf0ff; }   /* spoken words stand out as speech */
  .said::before { content: "「"; color: #8ea2ff; }
  .said::after  { content: "」"; color: #8ea2ff; }   /* quotes via CSS → always present on BOTH render paths */
  .me .bubble { background: #2a2350e6; border: 1px solid #3a3270; }
  /* narration = a clearly different "stage" band: centered, dim, boxed — never looks like a speech bubble */
  .desc { align-self: center; color: #b9c0d0; font-size: 12.5px; font-style: italic; text-align: center; max-width: 90%; line-height: 1.6; padding: 7px 14px; background: rgba(10,11,16,.58); border-radius: 12px; border: 1px dashed #ffffff1f; }
  .think { align-self: flex-end; background: #20202ae6; color: #bbb; font-style: italic; padding: 9px 13px; border-radius: 13px; max-width: 88%; }
  .typing .bubble { background: #1c2030e6; border: 1px solid #2a3350; color: #9fb0ff; }
  .typing .bubble span { animation: blink 1.2s infinite; }
  .typing .bubble span:nth-child(2){ animation-delay:.2s } .typing .bubble span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,60%,100%{opacity:.2} 30%{opacity:1} }
  footer { flex: 0 0 auto; padding: 12px 16px; border-top: 1px solid #23232c44; display: flex; gap: 8px; align-items: center; background: rgba(13,13,18,.55); backdrop-filter: blur(8px); }
  footer select { background: #0d0d12; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 9px; }
  footer input { margin: 0; }
  #goalbar { flex: 0 0 auto; margin: 8px 16px 0; padding: 8px 12px; border-radius: 10px; background: #1a2030cc; border: 1px solid #2a3350; color: #d8e0ff; font-size: 13px; line-height: 1.5; }
  #goalbar b { color: #ffd479; }
  #hintbar { flex: 0 0 auto; margin: 6px 16px 0; padding: 7px 12px; border-radius: 10px; background: #2a2410cc; border: 1px solid #4a3d18; color: #ecd9a6; font-size: 12.5px; line-height: 1.5; }
  #hintbar b { color: #ffd479; }
  #moveask { flex: 0 0 auto; margin: 6px 16px; padding: 9px 12px; border-radius: 10px; background: #14241fdd; border: 1px solid #2f5a45; color: #cfe6d4; font-size: 13px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #moveask b { color: #8fe0a6; }
  #moveask button { font-size: 12.5px; border-radius: 8px; padding: 4px 12px; cursor: pointer; border: 1px solid #3a4a40; }
  #moveask .go { background: #2a6b3e; border-color: #3c8a52; color: #eafff0; }
  #moveask .stay { background: #2a2d36; color: #c9c9d4; }
  #choiceask { flex: 0 0 auto; margin: 6px 16px; padding: 11px 14px; border-radius: 12px; background: #221a2edd; border: 1px solid #4a3a66; color: #e2d7f2; font-size: 13.5px; }
  #choiceask .q { font-weight: 700; color: #cfa8ff; margin-bottom: 8px; }
  #choiceask .opts { display: flex; flex-direction: column; gap: 6px; }
  #choiceask button { text-align: left; font-size: 13px; border-radius: 9px; padding: 8px 12px; cursor: pointer; background: #2c2340; border: 1px solid #4a3a66; color: #e8ddf8; }
  #choiceask button:hover { background: #3a2d54; }
  #placebar { flex: 0 0 auto; margin: 6px 16px 0; padding: 7px 12px; border-radius: 10px; background: #18221bcc; border: 1px solid #2c4233; color: #cfe6d4; font-size: 12.5px; line-height: 1.5; }
  #placebar b { color: #8fe0a6; }
  #placebar .exits { color: #8aa092; }
  #placebar .exit { cursor: pointer; text-decoration: underline dotted; padding: 0 1px; }
  #placebar .exit:hover { color: #bdf0c9; }
  /* relationship tag + follow control under each in-scene character */
  .castitem .rel { font-size: 10px; padding: 0 4px; border-radius: 6px; line-height: 1.5; white-space: nowrap; }
  .rel-stranger { color:#9aa0ad; background:#2a2d36; } .rel-peer { color:#cfd6e6; background:#2b3142; }
  .rel-friend { color:#8fe0a6; background:#1d3326; } .rel-flirt { color:#ffb3d1; background:#3a2230; }
  .rel-lover { color:#ff8fb0; background:#45202f; } .rel-enemy { color:#ff9a8f; background:#3a201d; }
  .rel-elder, .rel-junior { color:#e6d39a; background:#332d1d; }
  .castitem .follow { font-size:10px; cursor:pointer; border:1px solid #3a4060; background:#1a1f30; color:#aeb8e0; border-radius:7px; padding:1px 6px; white-space:nowrap; }
  .castitem .follow.on { background:#243a28; border-color:#3c6b45; color:#8fe0a6; }
  .castitem .follow.locked { opacity:.5; }
  .castitem .core { font-size:10px; color:#ffd479; }
  .castitem .nextrel { font-size:9.5px; color:#8a93a8; white-space:nowrap; line-height:1.3; }
  #clues { flex: 0 0 auto; margin: 6px 16px 0; padding: 8px 12px; border-radius: 10px; background: #161c2acc; border: 1px solid #2a3350; font-size: 12.5px; line-height: 1.7; }
  #clues .hd { color: #9fb0ff; font-weight: 600; }
  #clues .it { color: #c9c9d4; } #clues .it.done { color: #6fe0a6; }
  #suggest { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 4px; }
  .chip { font-size: 12px; padding: 5px 10px; border-radius: 14px; background: #1c2030cc; border: 1px solid #2a3350; color: #9fb0ff; cursor: pointer; }
  .chip:hover { background: #243056; }
  #state { flex: 0 0 auto; font-size: 12px; color: #b6b6c2; padding: 6px 16px; border-top: 1px dashed #23232c66; background: rgba(13,13,18,.4); }
  #state b { color: #8ea2ff; }
  .hidden { display: none; }
  a { color: #8ea2ff; cursor: pointer; }
  /* ending card shown inline at the end of the chat */
  .ending { align-self: center; max-width: 92%; margin: 18px 0 6px; padding: 18px 20px; border-radius: 14px;
            text-align: center; background: #16161df2; border: 1px solid #2a3350; box-shadow: 0 6px 30px #000a; }
  .ending .kind { font-size: 13px; letter-spacing: 2px; opacity: .85; }
  .ending h2 { margin: 6px 0 8px; font-size: 22px; }
  .ending p { color: #c9c9d4; line-height: 1.7; margin: 0 0 14px; }
  .ending.true  { border-color: #4caf7d; } .ending.true  .kind { color: #6fe0a6; }
  .ending.normal{ border-color: #5b6cff; } .ending.normal .kind { color: #9fb0ff; }
  .ending.bad   { border-color: #c8643c; } .ending.bad   .kind { color: #ff9d6f; }
  .ending.death { border-color: #b03a3a; } .ending.death .kind { color: #ff7a7a; }
#toasts { position:fixed; top:16%; left:50%; transform:translateX(-50%); z-index:60;
  display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast { padding:9px 18px; border-radius:20px; font-size:14px; color:#fff;
  background:rgba(20,22,30,.92); border:1px solid rgba(255,255,255,.18);
  box-shadow:0 6px 24px rgba(0,0,0,.45); animation:toastin .45s ease; max-width:82vw; }
.toast.out { opacity:0; transform:translateY(-8px); transition:all .55s ease; }
.toast.t-unlock { border-color:#e8c66c; color:#ffe9b0; }
.toast.t-rel { border-color:#ff8fb3; color:#ffd3e0; }
.toast.t-act { border-color:#8fb7ff; color:#d7e5ff; }
.toast.t-end { border-color:#c9a5ff; color:#ecdcff; }
.toast.t-delta { font-size:13px; opacity:.95; }
@keyframes toastin { from { opacity:0; transform:translateY(10px) scale(.96); } to { opacity:1; } }
</style>
</head>
<body>
<div id="bg"></div>
<audio id="bgm" loop></audio>
<audio id="sfx"></audio>
<div id="app">
  <header>
    <b>LinguisPlay <span class="muted" style="font-weight:400">· AI 虚构内容</span></b>
    <span style="display:flex; gap:8px; align-items:center">
      <button id="soundBtn" class="iconbtn hidden" title="背景音乐开关" onclick="toggleSound()">🔊</button>
      <button id="backBtn" class="ghost hidden" style="padding:5px 10px" onclick="backToPick()">← 剧本</button>
      <span id="who" class="muted"></span>
      <a id="logoutBtn" class="hidden" style="font-size:13px" onclick="doLogout()">退出</a>
    </span>
  </header>

  <!-- login -->
  <div id="auth" class="card">
    <h3 style="margin-top:0">登录 / 注册</h3>
    <input id="email" placeholder="email" value="player@demo.com" />
    <input id="pw" type="password" placeholder="密码（≥8位）" value="player123" />
    <div style="display:flex; gap:8px; margin-top:8px">
      <button onclick="login()">登录</button>
      <button class="ghost" onclick="signup()">注册（18+）</button>
    </div>
    <p id="authErr" style="color:#e66"></p>
    <p class="muted">提示：直接点「注册」就能用上面的默认账号开玩。</p>
    <p class="muted" style="border-top:1px solid #23232c; padding-top:10px; margin-top:14px; line-height:1.6">
      ⚠️ 本产品所有剧情与角色对白均由 <b>AI 生成</b>，纯属虚构，不代表真实人物或事件，仅供 18 岁以上用户娱乐。<br>
      如果你正经历情绪困扰或危机：中国大陆心理援助热线 <b>400-161-9995</b>；美国可拨打/发短信 <b>988</b>。
    </p>
  </div>

  <!-- story picker -->
  <div id="pick" class="card hidden">
    <h3 style="margin-top:0">选择剧本</h3>
    <div id="stories"></div>
  </div>

  <!-- role / mode picker -->
  <div id="role" class="card hidden">
    <div class="bar" style="justify-content:space-between"><h3 style="margin:0">选择玩法</h3><span class="bar"><a onclick="editCurrentStory()">✏️ 编辑这个剧本</a><a onclick="backToStories()">← 换剧本</a></span></div>
    <p class="muted" style="margin:6px 0 4px">扮演其中一个角色，亲自下场：</p>
    <div id="roleChars"></div>
    <p class="muted" style="border-top:1px solid #23232c; padding-top:12px; margin-top:12px">或者，当个隐形看客：</p>
    <button style="width:100%" onclick="startRun(currentStoryId,'god',null)">👁 上帝模式 · 旁观（看角色们彼此互动）</button>
  </div>

  <!-- chat -->
  <div id="play" class="hidden" style="flex:1; display:flex; flex-direction:column; min-height:0">
    <div id="cast"></div>
    <div id="placebar" class="hidden"></div>
    <div id="goalbar" class="hidden"></div>
    <div id="hintbar" class="hidden"></div>
    <div id="clues" class="hidden"></div>
    <div id="chat"></div>
    <div id="suggest"></div>
    <div id="moveask" class="hidden"></div>
    <div id="choiceask" class="hidden"></div>
    <div id="state"></div>
    <footer>
      <select id="channel" onchange="updatePlaceholder()">
        <option value="say">说</option>
        <option value="do">做</option>
        <option value="think">看/想</option>
      </select>
      <input id="msg" placeholder="说点什么…" onkeydown="if(event.key==='Enter')send()" />
      <button id="sendBtn" onclick="send()">发送</button>
    </footer>
  </div>
</div>

<script>
const API = "/api/v1";
let runId = null, personaId = null, myName = "我";
let soundOn = true, curBgmMood = null;
let curScene = null, curLocId = null;  // for backdrop: last scene + current place id
let cast = [], target = null;  // target = character_id the player is addressing (null = auto)
let relations = {}, following = [];  // {cid:{mode,mode_name,romance,...}} ; ids traveling with you
let currentStoryId = null, playMode = "character";

const MOOD_GRAD = {
  tense:    "linear-gradient(135deg,#2a0d12,#0d0d12)",
  eerie:    "linear-gradient(135deg,#0c1a16,#0c0c18)",
  warm:     "linear-gradient(135deg,#2a1d0d,#140d0a)",
  romantic: "linear-gradient(135deg,#2a0d22,#140d18)",
  sad:      "linear-gradient(135deg,#0d1626,#0c0c14)",
  lonely:   "linear-gradient(135deg,#10131c,#0a0a0e)",
  daily:    "linear-gradient(135deg,#15151c,#0d0d12)",
  calm:     "linear-gradient(135deg,#101820,#0c0c12)",
};

async function j(path, opts={}) {
  const r = await fetch(API + path, { credentials: "include", headers: {"Content-Type":"application/json"}, ...opts });
  if (!r.ok) { const b = await r.json().catch(()=>({})); throw new Error(b.detail || r.status); }
  return r.status === 204 ? null : r.json();
}
const show = (id) => document.getElementById(id).classList.remove("hidden");
const hide = (id) => document.getElementById(id).classList.add("hidden");
function escapeHtml(s){ return (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ── auth ──────────────────────────────────────────────
async function signup() {
  try {
    await j("/auth/signup", { method:"POST", body: JSON.stringify({ email: email.value, password: pw.value, dob: "1995-05-05", accepted_tos: true }) });
    await afterAuth();
  } catch(e){ authErr.textContent = e.message; }
}
async function login() {
  try { await j("/auth/login", { method:"POST", body: JSON.stringify({ email: email.value, password: pw.value }) }); await afterAuth(); }
  catch(e){ authErr.textContent = e.message; }
}
async function afterAuth() {
  const me = await j("/me");
  who.textContent = me.email;
  hide("auth"); show("logoutBtn");
  let masks = await j("/personas");
  if (!masks.length) masks = [await j("/personas", { method:"POST", body: JSON.stringify({ name:"我", pronouns:"they" }) })];
  const mask = masks.find(m=>m.is_default) || masks[0];
  personaId = mask.id; myName = mask.name || "我";
  const page = await j("/stories");
  stories.innerHTML = "";
  if (!page.items.length) { stories.innerHTML = "<p class='muted'>还没有已发布的剧本。</p>"; show("pick"); return; }
  page.items.forEach(s => {
    const div = document.createElement("div");
    div.className = "card"; div.style.margin = "10px 0"; div.style.cursor = "pointer";
    div.innerHTML = `<b>${escapeHtml(s.title)}</b><div class="muted" style="margin-top:4px">${escapeHtml(s.one_liner||"")}</div>`;
    div.onclick = () => chooseRole(s.id);
    stories.appendChild(div);
  });
  show("pick");
}

// ── role / mode selection ─────────────────────────────
async function chooseRole(storyId) {
  currentStoryId = storyId;
  const story = await j(`/stories/${storyId}`);
  const all = (story.characters || []).filter(c => (c.presence || "present") !== "offstage");
  // only author-designated playable roles; if the story flags none, fall back to all (legacy)
  const flagged = all.filter(c => c.playable);
  const chars = flagged.length ? flagged : all;
  roleChars.innerHTML = "";
  chars.forEach(c => {
    const b = document.createElement("button");
    b.className = "ghost"; b.style.cssText = "width:100%; text-align:left; margin:4px 0";
    b.innerHTML = `扮演 <b>${escapeHtml(c.name||"?")}</b>${c.is_lead?" · 主角":""}` +
      (c.role ? `<span class="muted"> — ${escapeHtml(c.role)}</span>` : "");
    b.onclick = () => startRun(storyId, "character", c.id, c.name);
    roleChars.appendChild(b);
  });
  if (!chars.length) roleChars.innerHTML = "<p class='muted'>这个剧本还没有可扮演的角色。</p>";
  hide("pick"); show("role");
}
function backToStories() { hide("role"); show("pick"); }
function editCurrentStory() { if (currentStoryId) location.href = `/studio?story=${currentStoryId}`; }

// ── run lifecycle ─────────────────────────────────────
async function startRun(storyId, mode="character", playerCharacterId=null, playerCharacterName=null) {
  playMode = mode;
  myName = (mode === "character" && playerCharacterName) ? playerCharacterName : "我";
  const run = await j("/runs", { method:"POST", body: JSON.stringify({
    story_id: storyId, persona_id: personaId, mode, player_character_id: playerCharacterId }) });
  runId = run.id;
  hide("role");
  hide("pick"); show("play"); show("backBtn"); show("soundBtn");
  resetEnded();
  chat.innerHTML = ""; suggest.innerHTML = ""; state.innerHTML = "";
  curBgmMood = null; curScene = null; curLocId = null;
  target = null;
  cast = (run.state && run.state.here) || run.cast || [];
  relations = (run.state && run.state.relations) || {};
  following = (run.state && run.state.following) || [];
  renderCast();
  // god mode = director cues; 说/做/想 channel doesn't apply
  channel.style.display = playMode === "god" ? "none" : "";
  updatePlaceholder();
  applyScene(run.state && run.state.scene);
  const beats = await j(`/runs/${runId}/play`);
  beats.forEach(renderBeat);
  renderState(run.state);
  renderChoiceAsk(run.state && run.state.pending_choice);
  // resuming an already-finished run: re-show its ending and keep input locked
  if (run.state && run.state.ended) showEnding(run.state.ending);
}
// 悬念离场: tell the server we're leaving so it appends ONE cliffhanger beat — the
// unfinished hook is the last thing we see when we come back.
function sendLeave() { if (runId) { try { navigator.sendBeacon(`/runs/${runId}/leave`); } catch (e) {} } }
window.addEventListener("pagehide", sendLeave);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") sendLeave(); });

function backToPick() { sendLeave(); runId = null; stopBgm(); hide("play"); hide("backBtn"); hide("soundBtn"); show("pick"); }
async function doLogout() {
  sendLeave();  // must fire while the session cookie is still valid
  try { await j("/auth/logout", { method:"POST" }); } catch(e){}
  runId = null; stopBgm();
  hide("play"); hide("pick"); hide("role"); hide("backBtn"); hide("soundBtn"); hide("logoutBtn");
  show("auth");
}

// ── rendering ─────────────────────────────────────────
function avatarColor(name){ let h=0; for(const c of (name||"?")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h},45%,42%)`; }
function avatarEl(name){ const a=document.createElement("div"); a.className="av"; a.style.background=avatarColor(name); a.textContent=(name||"?").slice(0,1); return a; }

function renderBeat(b) {
  let node;
  if (b.author === "player") {
    if (b.type === "think") { node = document.createElement("div"); node.className = "beat think"; node.textContent = "（观察）" + b.text; }
    else { node = makeRow("right", myName, b.text); }
  } else if (b.type === "description") {
    node = document.createElement("div"); node.className = "desc"; node.textContent = b.text;
  } else {
    node = makeRow("left", b.speaker_name || "", b.text, true, true);
  }
  chat.appendChild(node); chat.scrollTop = chat.scrollHeight;
  return node;
}
// `spoken` = wrap the text in 「」 and style it as speech, so a dialogue bubble is
// unmistakably "words said out loud" vs the narration band.
function makeRow(side, name, text, withWho, spoken) {
  const row = document.createElement("div"); row.className = "row " + side + (side==="left"?" npc":" me");
  row.appendChild(avatarEl(name));
  const bub = document.createElement("div"); bub.className = "bubble";
  const body = spoken ? `<span class="said">${escapeHtml(text)}</span>` : escapeHtml(text);
  bub.innerHTML = (withWho ? `<div class="who">${escapeHtml(name)}</div>` : "") + body;
  row.appendChild(bub);
  return row;
}
const MODE_CLASS = { "陌生人":"stranger","同级":"peer","朋友":"friend","暧昧对象":"flirt","恋人":"lover","敌人":"enemy","长辈":"elder","小辈":"junior" };
function renderCast() {
  const el = document.getElementById("cast");
  if (!cast.length && playMode !== "god") { el.classList.add("hidden"); return; }
  el.classList.remove("hidden"); el.innerHTML = "";
  // the "所有人" / broadcast pseudo-target
  const all = document.createElement("div");
  all.className = "castitem" + (target === null ? " sel" : "");
  all.appendChild(avatarEl("所有人"));
  const as = document.createElement("small"); as.textContent = "所有人"; all.appendChild(as);
  all.onclick = () => { target = null; renderCast(); updatePlaceholder(); };
  el.appendChild(all);

  cast.forEach(c => {
    const d = document.createElement("div");
    d.className = "castitem" + (target === c.id ? " sel" : "");
    d.appendChild(avatarEl(c.name));
    const s = document.createElement("small"); s.textContent = c.name; d.appendChild(s);
    // relationship tag (skip the lead — the spine character has no flowing mode)
    const rel = relations[c.id];
    if (rel && rel.mode_name && !c.is_lead) {
      const t = document.createElement("span");
      t.className = "rel rel-" + (MODE_CLASS[rel.mode_name] || "stranger");
      t.textContent = rel.mode_name + ((rel.romance|0) >= 25 ? " ♥" : "");
      d.appendChild(t);
      // proximity hook: "差X→朋友" — the daily "one more step" pull
      if (rel.next && rel.next.name) {
        const nx = document.createElement("span"); nx.className = "nextrel";
        nx.textContent = `差${rel.next.to_next}→${rel.next.name}`;
        d.appendChild(nx);
      }
    }
    // follow control (the lead is always with you; others can be invited / dismissed)
    if (c.is_lead) {
      const core = document.createElement("span"); core.className = "core"; core.textContent = "核心";
      d.appendChild(core);
    } else if (playMode !== "god") {
      const on = following.includes(c.id);
      const canFollow = on || c.can_follow !== false;  // needs 好感 to invite (unless already along)
      const b = document.createElement("span");
      b.className = "follow" + (on ? " on" : "") + (canFollow ? "" : " locked");
      b.textContent = on ? "🚶同行中" : (canFollow ? "邀同行" : "🔒邀同行");
      b.title = canFollow ? "" : "关系还不够近，多聊聊再请 TA 同行";
      b.onclick = (e) => { e.stopPropagation(); toggleFollow(c.id, !on); };
      d.appendChild(b);
    }
    d.onclick = () => { target = (target === c.id ? null : c.id); renderCast(); updatePlaceholder(); };
    el.appendChild(d);
  });
}
function updateCast(next) {
  if (!Array.isArray(next)) return;
  cast = next;
  if (target && !cast.some(c => c.id === target)) target = null;
  renderCast(); updatePlaceholder();
}
// apply a Run object's state to the scene UI (used by move / follow responses)
function applyRunUpdate(run) {
  const st = run && run.state || {};
  cast = st.here || run.cast || [];
  relations = st.relations || {};
  following = st.following || [];
  if (target && !cast.some(c => c.id === target)) target = null;
  renderCast(); updatePlaceholder();
  if (st.location !== undefined) renderPlace(st.location);
}
async function moveTo(name) {
  if (!runId || ended) return;
  try {
    const run = await j(`/runs/${runId}/move`, { method:"POST", body: JSON.stringify({ location: name }) });
    applyRunUpdate(run);
    const who = following.length ? `（你带着同行的人来到了 ${name}。）` : `（你来到了 ${name}。）`;
    renderBeat({ author:"engine", type:"description", text: who });
  } catch(e) { renderBeat({ author:"engine", type:"description", text:`（${e.message}）` }); }
}
async function toggleFollow(id, want) {
  if (!runId || ended) return;
  try {
    const run = await j(`/runs/${runId}/follow`, { method:"POST", body: JSON.stringify({ character_id: id, follow: want }) });
    applyRunUpdate(run);
  } catch(e) { renderBeat({ author:"engine", type:"description", text:`（${e.message}）` }); }
}
// a character asked to lead the player elsewhere → confirm before moving
function renderMoveAsk(req) {
  const el = document.getElementById("moveask");
  if (!req || ended) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  el.innerHTML = "";
  const t = document.createElement("span");
  const tail = req.generate ? "（一处新的去处，去了才知道是什么样）" : "";
  t.innerHTML = `🚪 <b>${escapeHtml(req.by_name||"对方")}</b> 想带你去 <b>${escapeHtml(req.to_name||"")}</b>${tail}`;
  const go = document.createElement("button"); go.className = "go"; go.textContent = `跟 TA 去`;
  go.onclick = () => acceptMove(req);
  const stay = document.createElement("button"); stay.className = "stay"; stay.textContent = "留下";
  stay.onclick = () => { renderMoveAsk(null); renderBeat({ author:"engine", type:"description", text:`（你没有动，留在了原地。）` }); };
  el.append(t, go, stay); el.classList.remove("hidden");
}
async function acceptMove(req) {
  renderMoveAsk(null);
  if (!runId || ended) return;
  try {
    const run = await j(`/runs/${runId}/move`, { method:"POST", body: JSON.stringify({ location: req.to || req.to_name, with_character_id: req.by_id, generate: !!req.generate }) });
    applyRunUpdate(run);
    renderBeat({ author:"engine", type:"description", text:`（你跟着${req.by_name||"对方"}来到了 ${req.to_name}。）` });
  } catch(e) { renderBeat({ author:"engine", type:"description", text:`（${e.message}）` }); }
}
// 关键节点抉择 (VN choice): an authored decision card. Picking applies its effects
// server-side, then the label is sent as the player's own line so the cast reacts to it.
function renderChoiceAsk(ch) {
  const el = document.getElementById("choiceask");
  if (!ch || ended) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  el.innerHTML = "";
  const q = document.createElement("div"); q.className = "q";
  q.textContent = `⚖️ ${ch.prompt}`;
  const wrap = document.createElement("div"); wrap.className = "opts";
  for (const o of (ch.options || [])) {
    const b = document.createElement("button");
    b.textContent = o.label;
    b.onclick = () => pickChoice(o.id);
    wrap.appendChild(b);
  }
  el.append(q, wrap); el.classList.remove("hidden");
}
async function pickChoice(optionId) {
  if (!runId || ended) return;
  renderChoiceAsk(null);
  try {
    const res = await j(`/runs/${runId}/choose`, { method:"POST", body: JSON.stringify({ option_id: optionId }) });
    if (res.label) { msg.value = res.label; await send(); }  // the pick becomes the player's own line
  } catch(e) { renderBeat({ author:"engine", type:"description", text:`（${e.message}）` }); }
}
function updatePlaceholder() {
  const c = cast.find(x => x.id === target);
  if (playMode === "god") {
    msg.placeholder = c ? `把镜头给${c.name}…（引导这场戏）` : "给这场戏一个引导，如「让他们聊聊过去」（留空也能继续看）";
    return;
  }
  if (channel && channel.value === "think") {
    msg.placeholder = c ? `打量${c.name}…（看 TA 的神情/状态，可留空）` : "观察四周…（这是哪、什么情况，可留空）";
    return;
  }
  msg.placeholder = c ? `单独对${c.name}说…` : "对所有人说…（点上方头像可单独对一个人说）";
}

function renderState(st) {
  if (!st) return;
  state.innerHTML = `第 <b>${st.act}</b> 幕 · 好感 <b>${st.affinity}</b> · 已解锁碎片 <b>${(st.unlocked_fragment_ids||[]).length}</b>`;
  if (st.goal !== undefined) renderGoal(st.goal);
  if (st.progress !== undefined) renderProgress(st.progress);
  if (st.location !== undefined) renderPlace(st.location);
}
function renderPlace(loc) {
  // track the current place so the background can use its AI-generated image
  const newLocId = (loc && loc.id) || null;
  if (newLocId !== curLocId) { curLocId = newLocId; paintBackground(); }
  const el = document.getElementById("placebar");
  if (!loc || !loc.name) { el.classList.add("hidden"); return; }
  const exits = (loc.exits||[]).filter(Boolean);
  el.innerHTML = `📍 <b>${escapeHtml(loc.name)}</b>`;
  if (exits.length) {
    const wrap = document.createElement("span"); wrap.className = "exits"; wrap.append("　→ 可去：");
    exits.forEach((name, i) => {
      if (i) wrap.append("、");
      const a = document.createElement("span"); a.className = "exit"; a.textContent = name;
      a.onclick = () => moveTo(name);
      wrap.appendChild(a);
    });
    el.appendChild(wrap);
  }
  el.classList.remove("hidden");
}
function renderGoal(goal) {
  const el = document.getElementById("goalbar");
  if (goal) { el.innerHTML = `🎯 <b>当前目标</b>：${escapeHtml(goal)}`; el.classList.remove("hidden"); }
  else el.classList.add("hidden");
}
function renderHint(hint) {
  const el = document.getElementById("hintbar");
  if (hint) { el.innerHTML = `💡 <b>线索</b>：${escapeHtml(hint)}`; el.classList.remove("hidden"); }
  else el.classList.add("hidden");
}
function renderProgress(prog) {
  const el = document.getElementById("clues");
  if (!prog || !prog.total) { el.classList.add("hidden"); return; }
  const rows = prog.items.map(it =>
    `<span class="it ${it.done?'done':''}">${it.done?'✓':'○'} ${escapeHtml(it.label)}</span>`
  ).join("　");
  el.innerHTML = `<span class="hd">🔎 线索 ${prog.done}/${prog.total}</span>　${rows}`;
  el.classList.remove("hidden");
}
function renderSuggest(items) {
  suggest.innerHTML = "";
  (items||[]).forEach(t => {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = "💡 " + t;
    c.onclick = () => { const isAct = t.startsWith("用「做」"); msg.value = isAct ? "" : t; if (isAct) channel.value = "do"; msg.focus(); };
    suggest.appendChild(c);
  });
}

// ── ending ────────────────────────────────────────────
const KIND_LABEL = { true: "真结局", normal: "结局", bad: "坏结局", death: "你死了" };
let ended = false;
function showEnding(ending) {
  if (!ending) return;
  const kind = ending.kind || "normal";
  const terminal = ending.terminal || kind === "death";
  // Milestones (true/normal/bad reached by conditions) DON'T end the run — the
  // narration is already shown inline as beats; keep the world open for exploration.
  if (!terminal) return;
  // Death is genuinely terminal: show the closing card and lock input.
  ended = true;
  const card = document.createElement("div");
  card.className = "ending " + kind;
  card.innerHTML = `<div class="kind">— ${KIND_LABEL[kind] || "结局"} —</div>`
    + `<h2>${escapeHtml(ending.title || "")}</h2>`
    + (ending.text ? `<p>${escapeHtml(ending.text)}</p>` : "");
  const btn = document.createElement("button");
  btn.textContent = "再玩一局 / 换个剧本"; btn.onclick = backToPick;
  card.appendChild(btn);
  chat.appendChild(card); chat.scrollTop = chat.scrollHeight;
  msg.disabled = true; sendBtn.disabled = true; channel.disabled = true;
  suggest.innerHTML = "";
  msg.placeholder = "你已经死了";
}
function resetEnded() { ended = false; msg.disabled = false; channel.disabled = false; sendBtn.disabled = false; }

// ── typing indicator ──────────────────────────────────
let typingEl = null;
function showTyping(name) {
  typingEl = document.createElement("div"); typingEl.className = "row left typing";
  typingEl.appendChild(avatarEl(name));
  const b = document.createElement("div"); b.className = "bubble"; b.innerHTML = "<span>●</span><span>●</span><span>●</span>";
  typingEl.appendChild(b); chat.appendChild(typingEl); chat.scrollTop = chat.scrollHeight;
}
function hideTyping(){ if (typingEl){ typingEl.remove(); typingEl = null; } }

// ── typewriter / sequential beat playback ─────────────
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function makeTypingRow(side, name) {
  const row = document.createElement("div"); row.className = "row " + side + (side==="left"?" npc":" me");
  row.appendChild(avatarEl(name));
  const bub = document.createElement("div"); bub.className = "bubble";
  const who = document.createElement("div"); who.className = "who"; who.textContent = name; bub.appendChild(who);
  // .said → CSS adds the 「」 quotes, so streamed speech looks identical to replayed speech
  const txt = document.createElement("span"); if (side === "left") txt.className = "said"; bub.appendChild(txt);
  row.appendChild(bub); chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  return txt;
}
async function typeInto(el, text, ms=22) {
  el.textContent = "";
  for (const ch of (text||"")) {
    el.textContent += ch;
    chat.scrollTop = chat.scrollHeight;
    // a touch of cadence: linger on punctuation so it reads like real typing
    await sleep("，。！？…、—".includes(ch) ? ms*5 : ms);
  }
}
// play one engine beat with a "typing…" pause then a typewriter reveal
async function playBeat(b) {
  if (b.author === "player") { renderBeat(b); return; }
  if (b.type === "description") {
    const node = document.createElement("div"); node.className = "desc"; chat.appendChild(node);
    await typeInto(node, b.text, 16);   // narration types a bit faster
  } else {
    showTyping(b.speaker_name || "");
    await sleep(450 + Math.random()*500);   // "thinking" beat before they speak
    hideTyping();
    const txt = makeTypingRow("left", b.speaker_name || "");
    await typeInto(txt, b.text, 22);
  }
  chat.scrollTop = chat.scrollHeight;
}

// ── immersive scene (background / bgm / sfx) ──────────
function applyScene(scene) {
  if (!scene) return;
  curScene = scene;
  const mood = scene.mood || "daily";
  paintBackground();
  // bgm by mood (loops). silent if file missing.
  if (mood !== curBgmMood) {
    curBgmMood = mood;
    bgm.src = `/scene/bgm/${mood}.mp3`;
    if (soundOn) bgm.play().catch(()=>{});
  }
  // one-shot sfx
  if (scene.sfx) { sfx.src = `/scene/sfx/${scene.sfx}.mp3`; if (soundOn) sfx.play().catch(()=>{}); }
}
// Paint the backdrop. Priority: AI-generated per-LOCATION image (consistent for a place) →
// keyword/preset image from the scene classifier → mood gradient. Each step degrades to the
// next if the image 404s, so missing art is never a hard failure.
function paintBackground() {
  const scene = curScene || {};
  const mood = scene.mood || "daily";
  bg.style.background = MOOD_GRAD[mood] || MOOD_GRAD.daily;  // gradient base, always set
  if (curLocId) {
    const locUrl = `/scene/bg/${curLocId}.jpg`;
    const im = new Image();
    im.onload = () => { bg.style.backgroundImage = `url(${locUrl})`; };
    im.onerror = () => paintKeywordBg(scene);  // no AI image for this place → fall back
    im.src = locUrl;
  } else {
    paintKeywordBg(scene);
  }
}
function paintKeywordBg(scene) {
  if (!scene || !scene.bg) return;  // gradient stays
  const stem = scene.night ? scene.bg + "_night" : scene.bg;
  const url = `/scene/bg/${stem}.jpg`;
  const img = new Image();
  img.onload = () => { bg.style.backgroundImage = `url(${url})`; };
  img.onerror = () => { if (scene.night) { const f=new Image(); const u2=`/scene/bg/${scene.bg}.jpg`; f.onload=()=>bg.style.backgroundImage=`url(${u2})`; f.src=u2; } };
  img.src = url;
}
function toggleSound() {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊" : "🔇";
  if (soundOn) { bgm.play().catch(()=>{}); } else { bgm.pause(); }
}
function stopBgm(){ try { bgm.pause(); bgm.removeAttribute("src"); curBgmMood=null; } catch(e){} }

// ── send turn (SSE) ───────────────────────────────────
async function send() {
  const text = msg.value.trim();
  if (!runId || ended) return;
  const canEmpty = playMode === "god" || channel.value === "think";  // observe/watch can be empty
  if (!text && !canEmpty) return;
  msg.value = ""; sendBtn.disabled = true; suggest.innerHTML = "";
  if (text) {
    if (playMode === "god") renderBeat({ author:"player", type:"description", text:"（旁观指引）"+text });
    else renderBeat({ author:"player", type: channel.value==="think"?"think":"dialogue", text });
  }
  showTyping("");
  // beats stream in AS the server computes each responder → play them one-by-one (typed)
  // the moment they arrive, so the first character appears in ~2-3s, the rest follow.
  playQ = []; playing = false; streamDone = false; firstBeat = true;
  afterPlay = { suggest: null, ending: undefined, moveReq: null, moments: null, relDeltas: null, choice: null };
  renderMoveAsk(null);  // clear any prior pending move prompt
  try {
    const r = await fetch(`${API}/runs/${runId}/play`, {
      method:"POST", credentials:"include", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ input: text, channel: channel.value, target_character_id: target }) });
    const reader = r.body.getReader(); const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx+2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.event === "beat") { if (firstBeat){ hideTyping(); firstBeat=false; } playQ.push(ev.beat); pump(); }
        else if (ev.event === "state") { renderState(ev.state); }
        else if (ev.event === "scene") { applyScene(ev.scene); }
        else if (ev.event === "cast") { updateCast(ev.cast); }
        else if (ev.event === "here") { relations = ev.relations || {}; following = ev.following || []; updateCast(ev.here || []); }
        else if (ev.event === "goal") { renderGoal(ev.goal); }
        else if (ev.event === "place") { renderPlace(ev.location); }
        else if (ev.event === "progress") { renderProgress(ev.progress); }
        else if (ev.event === "hint") { renderHint(ev.hint); }
        else if (ev.event === "moments") { afterPlay.moments = ev.moments; afterPlay.relDeltas = ev.rel_deltas; }
        else if (ev.event === "choice") { afterPlay.choice = ev.choice; }
        else if (ev.event === "move_request") { afterPlay.moveReq = ev.move_request; }
        else if (ev.event === "suggest") { afterPlay.suggest = ev.suggestions; }
        else if (ev.event === "ending") { afterPlay.ending = ev.ending; }
      }
    }
  } catch(e){ playQ.push({author:"engine",type:"description",text:"[出错] "+e.message}); pump(); }
  hideTyping();
  streamDone = true;
  if (!playing) finishTurn();   // queue already drained (or nothing arrived)
}
// ── streaming beat queue: play arrivals one-by-one while more stream in ──
let playQ = [], playing = false, streamDone = false, firstBeat = true, afterPlay = null;
async function pump() {
  if (playing) return; playing = true;
  while (playQ.length) await playBeat(playQ.shift());
  playing = false;
  if (streamDone) finishTurn();
}
// 阈值时刻演出: celebration toasts for threshold moments (new truth / relationship
// tier-up / new act / ending milestone) + floating ♥ deltas. Staggered, self-dismissing.
function toastWrap() {
  let w = document.getElementById("toasts");
  if (!w) {
    w = document.createElement("div"); w.id = "toasts";
    document.body.appendChild(w);
  }
  return w;
}
function pushToast(html, cls, delay) {
  setTimeout(() => {
    const t = document.createElement("div");
    t.className = "toast " + (cls || "");
    t.innerHTML = html;
    toastWrap().appendChild(t);
    setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 600); }, 3800);
  }, delay || 0);
}
function showMoments(moments, relDeltas) {
  let i = 0;
  for (const m of moments) {
    if (m.kind === "unlock") pushToast(`🔓 真相拼上一块：「${m.title}」`, "t-unlock", i++ * 650);
    else if (m.kind === "rel_up") pushToast(`💗 你和 ${m.name} 成了「${m.mode_name}」`, "t-rel", i++ * 650);
    else if (m.kind === "act") pushToast(`📖 进入第${m.index}幕${m.title ? " · " + m.title : ""}`, "t-act", i++ * 650);
    else if (m.kind === "ending" && !m.terminal) pushToast(`🏆 达成结局：「${m.title || m.ending_kind}」`, "t-end", i++ * 650);
  }
  const bits = [];
  for (const cid in relDeltas) {
    const d = relDeltas[cid];
    const parts = [];
    if (d.closeness) parts.push(`♥${d.closeness > 0 ? "+" : ""}${d.closeness}`);
    if (d.romance) parts.push(`💓${d.romance > 0 ? "+" : ""}${d.romance}`);
    if (parts.length) bits.push(`${d.name} ${parts.join(" ")}`);
  }
  if (bits.length) pushToast(bits.join(" ／ "), "t-delta", i * 650);
}

function finishTurn() {
  if (afterPlay) {
    if ((afterPlay.moments && afterPlay.moments.length) || (afterPlay.relDeltas && Object.keys(afterPlay.relDeltas).length))
      showMoments(afterPlay.moments || [], afterPlay.relDeltas || {});
    if (afterPlay.choice && !ended) renderChoiceAsk(afterPlay.choice);
    if (afterPlay.suggest && !ended) renderSuggest(afterPlay.suggest);
    if (afterPlay.moveReq && !ended) renderMoveAsk(afterPlay.moveReq);
    if (afterPlay.ending !== undefined) showEnding(afterPlay.ending);
    afterPlay = null;
  }
  sendBtn.disabled = false; msg.focus();
}
</script>
</body>
