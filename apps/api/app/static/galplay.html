<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>🎀 LinguisPlay Gal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #e7eaf3; overflow: hidden;
               font: 15px/1.8 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* 📱 the phone stage: 9:16, centered; everything outside is pure black */
  #stage { position: relative; aspect-ratio: 9/16; height: min(100vh, 177.7vw);
           margin: 0 auto; top: 50%; transform: translateY(-50%);
           overflow: hidden; background: #05050a; user-select: none; cursor: pointer; }
  #gbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
         transition: opacity .6s ease; }
  /* 🎭 双立绘位: 竖屏不平分左右（脸会小），前后景深错位 + Auto Highlight
     （说话者前景点亮，另一位缩小压暗置后；位置一旦分定不再交换，防跳动） */
  .sp { position: absolute; bottom: 24%; transform: translateX(-50%);
        max-width: 92%; object-fit: contain; object-position: bottom;
        transition: opacity .35s ease, left .3s ease, height .3s ease, filter .3s ease; }
  .sp.center { left: 50%; }
  .sp.left   { left: 32%; }
  .sp.right  { left: 68%; }
  .sp.front  { height: 60%; z-index: 3;
               filter: brightness(1) drop-shadow(0 6px 22px rgba(0,0,0,.55)); }
  .sp.back   { height: 51%; z-index: 2;
               filter: brightness(.45) drop-shadow(0 6px 22px rgba(0,0,0,.55)); }
  .sp.front.dim { filter: brightness(.72) drop-shadow(0 6px 22px rgba(0,0,0,.55)); }
  .off { opacity: 0 !important; }
  #gbox { position: absolute; left: 3%; right: 3%; bottom: 2.6%; min-height: 26%;
          background: rgba(8,8,16,.82); border: 1px solid #3a3a52; border-radius: 14px;
          padding: 26px 16px 18px; backdrop-filter: blur(4px); }
  #gname { position: absolute; top: -13px; left: 12px; background: #232346;
           border: 1px solid #4a4a72; color: #ffd479; border-radius: 9px;
           padding: 2px 12px; font-size: 13px; font-weight: 700; }
  #gtext { font-size: 15.5px; line-height: 1.85; min-height: 4.6em; }
  #gtext.narr { color: #c3c9d9; }
  #gnext { position: absolute; right: 13px; bottom: 7px; color: #8ea2ff; font-size: 13px;
           animation: blink 1.1s steps(2) infinite; visibility: hidden; }
  @keyframes blink { 50% { opacity: 0; } }
  #gctl { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 5; }
  #gctl span { background: rgba(20,20,36,.8); border: 1px solid #45456a; border-radius: 9px;
               padding: 4px 10px; font-size: 12px; color: #9fb0ff; cursor: pointer; }
  #gctl span.on { color: #ffd479; border-color: #ffd479; }
  /* 🎯 选择点: the player's hand on the wheel */
  #gchoice { position: absolute; left: 7%; right: 7%; bottom: 31%; z-index: 6;
             display: none; flex-direction: column; gap: 10px; }
  #gchoice button { background: rgba(12,12,26,.93); border: 1px solid #5a5a8a;
                    color: #e7eaf3; border-radius: 12px; padding: 12px 14px;
                    font: inherit; font-size: 14.5px; cursor: pointer;
                    text-align: center; backdrop-filter: blur(3px); }
  #gchoice button:hover { border-color: #ffd479; color: #ffd479; }
  /* 标题画面 */
  #gtitle { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end; padding-bottom: 12%;
            background: #05050a; background-size: cover; background-position: center; }
  #gtitle::before { content: ""; position: absolute; inset: 0;
                    background: linear-gradient(transparent 40%, rgba(3,3,8,.9)); }
  #gtitle h1 { position: relative; font-size: 26px; letter-spacing: 4px;
               text-shadow: 0 2px 12px rgba(0,0,0,.9); margin-bottom: 24px; }
  #gtitle .muted { position: relative; }
  #gtitle button { position: relative; width: 200px; margin-top: 12px; padding: 12px;
                   background: rgba(20,20,36,.88); border: 1px solid #45456a; color: #e7eaf3;
                   border-radius: 11px; font: inherit; font-size: 15px; cursor: pointer; }
  #gtitle button:hover { border-color: #8ea2ff; }
  #gend { position: absolute; inset: 0; z-index: 9; display: none; flex-direction: column;
          align-items: center; justify-content: center; background: rgba(3,3,8,.92); }
  #gend h2 { font-size: 22px; letter-spacing: 6px; margin-bottom: 18px; }
  #gend .muted, .muted { color: #8b93a7; font-size: 13px; }
  #gend button { margin-top: 22px; width: 180px; padding: 11px;
                 background: rgba(20,20,36,.88); border: 1px solid #45456a; color: #e7eaf3;
                 border-radius: 11px; font: inherit; cursor: pointer; }
  #glog { position: absolute; inset: 0; z-index: 8; display: none; overflow-y: auto;
          background: rgba(5,5,10,.96); padding: 46px 16px 20px; }
  #glog .l { margin-bottom: 10px; font-size: 14px; }
  #glog .l b { color: #ffd479; margin-right: 6px; }
  #glog .l.pick { color: #ffd479; }
</style>
</head>
<body>
<div id="stage" onclick="tap()">
  <img id="gbg" alt="">
  <img id="gsp0" class="sp off" alt="">
  <img id="gsp1" class="sp off" alt="">
  <div id="gctl">
    <span id="btnAuto" onclick="event.stopPropagation();toggleAuto()">▶ 自动</span>
    <span onclick="event.stopPropagation();toggleLog()">📖</span>
    <span onclick="event.stopPropagation();location.href='/maker'">✕</span>
  </div>
  <div id="glog" onclick="event.stopPropagation();toggleLog()"></div>
  <div id="gchoice"></div>
  <div id="gbox">
    <div id="gname" style="display:none"></div>
    <div id="gtext"></div>
    <div id="gnext">▼</div>
  </div>
  <div id="gend"><h2 id="gendT"></h2><div class="muted" id="gendS"></div>
    <button onclick="event.stopPropagation();restart()">从头再看</button></div>
  <div id="gtitle">
    <h1 id="gt"></h1>
    <div class="muted" id="gtEnds"></div>
    <button onclick="event.stopPropagation();startGame(false)">开 始</button>
    <button id="btnCont" style="display:none" onclick="event.stopPropagation();startGame(true)">继 续</button>
  </div>
</div>
<script>
const API = "/api/v1";
const workId = new URLSearchParams(location.search).get("work");
let W = null, sav = null, typing = false, autoOn = false, autoT = null, choosing = false;
const $ = id => document.getElementById(id);
const SKEY = () => "gal_sav_" + workId;
const EKEY = () => "gal_end_" + workId;
const chapters = () => ((W.script[W.protagonist_id] || {}).chapters) || [];

async function boot() {
  if (!workId) { location.href = "/maker"; return; }
  let r = await fetch(`${API}/gal/${workId}/script`);
  if (r.status === 401) { location.href = "/play"; return; }
  if (!r.ok) { $("gt").textContent = "作品还没准备好"; return; }
  W = await r.json();
  $("gt").textContent = W.title || "";
  $("gtitle").style.backgroundImage =
    W.manifest && W.manifest.cover ? `url(/scene/gal/${workId}/cover.jpg)` : "";
  const n = (W.endings || []).length;
  if (n) $("gtEnds").textContent = `已解锁 ${unlocked().length}/${n} 个结局`;
  if (localStorage.getItem(SKEY()) !== null) $("btnCont").style.display = "";
}
function unlocked() {
  try { return JSON.parse(localStorage.getItem(EKEY()) || "[]"); } catch (e) { return []; }
}
function fresh() { return { ch: 0, i: -1, br: null, end: null, vals: {}, picks: {} }; }
function save() { localStorage.setItem(SKEY(), JSON.stringify(sav)); }
function nameOf(cid) { const c = (W.characters || []).find(x => x.id === cid); return c ? c.name : ""; }
function curChoice(qid) {
  return (chapters()[sav.ch] || []).find(e => e.type === "choice" && e.id === qid);
}
function endingById(id) { return (W.endings || []).find(e => e.id === id); }
function listNow() {
  if (sav.end) { const e = endingById(sav.end); return e ? e.beats : []; }
  return chapters()[sav.ch] || [];
}

function startGame(cont) {
  $("gtitle").style.display = "none";
  $("gend").style.display = "none";
  let saved = null;
  if (cont) { try { saved = JSON.parse(localStorage.getItem(SKEY()) || "null"); } catch (e) {} }
  sav = (saved && typeof saved === "object" && "ch" in saved) ? saved : fresh();
  choosing = false;
  clearCast();
  showCurrent();
}
// continue lands back ON the beat that was last shown, not one past it
function showCurrent() {
  if (sav.br) {
    const c = curChoice(sav.br.q), opt = c && c.options[sav.br.o];
    if (opt && opt.beats[sav.br.j]) { showBeat(opt.beats[sav.br.j]); return; }
    sav.br = null;
  }
  const list = listNow();
  if (sav.i < 0 || sav.i >= list.length) { next(); return; }
  const b = list[sav.i];
  if (b.type === "choice") { showChoice(b); return; }
  showBeat(b);
}

function setBg(sid) {
  if (!sid) return;                       // synthetic cards keep the current bg
  const el = $("gbg");
  const want = `/scene/gal/${workId}/bg_${sid}.jpg`;
  if (el.dataset.sid === sid) return;
  clearCast();                            // 换场清台：人随新场景重新登场
  el.dataset.sid = sid;
  el.style.opacity = 0;
  setTimeout(() => { el.onerror = () => { el.removeAttribute("src"); el.style.opacity = 1; };
                     el.src = want; el.onload = () => el.style.opacity = 1; }, 320);
}
// 🎭 舞台账本: 最近两个开口的非主角占左右槽（播放器侧从 who 序列推导——
// 结构性要求不押在编译模型的自觉上）。槽位一经分定不再交换；第三人开口顶掉
// 此刻没在说话的那位；换场清台。
const spEls = () => [$("gsp0"), $("gsp1")];
let stageSlots = [null, null], stageSpeaker = -1;

function clearCast() {
  stageSlots = [null, null]; stageSpeaker = -1;
  spEls().forEach(el => el.classList.add("off"));
}
function setSrc(el, cid, expr) {
  const want = `/scene/gal/${workId}/${cid}_${expr || "常态"}.png`;
  const fallback = `/scene/gal/${workId}/${cid}_常态.png`;
  el.onerror = () => {   // a missing expression falls back to 常态, then hides
    if (want !== fallback && el.getAttribute("src") !== location.origin + fallback) {
      el.onerror = () => el.classList.add("off");
      el.src = fallback;
    } else el.classList.add("off");
  };
  if (el.getAttribute("src") !== location.origin + want) el.src = want;
}
function layoutCast() {
  const n = stageSlots.filter(Boolean).length;
  stageSlots.forEach((s, i) => {
    const el = spEls()[i];
    if (!s) { el.classList.add("off"); return; }
    setSrc(el, s.cid, s.expr);
    el.classList.remove("off", "left", "right", "center", "front", "back", "dim");
    if (n === 1) { el.classList.add("center", "front"); return; }
    el.classList.add(i === 0 ? "left" : "right",
                     i === stageSpeaker ? "front" : "back");
  });
}
function setStage(b) {
  // 🔞 成人拍：只有背景+文字框（Yi 拍板）；主角与旁白也不上立绘
  if (b.adult) { spEls().forEach(el => el.classList.add("off")); return; }
  const who = b.who;
  if (!who || who === W.protagonist_id) {
    // 旁白/主角开口：在场者保持站位，整体轻压一档（都在听）
    spEls().forEach(el => { if (!el.classList.contains("off")) el.classList.add("dim"); });
    return;
  }
  let i = stageSlots.findIndex(s => s && s.cid === who);
  if (i < 0) {
    i = stageSlots.findIndex(s => !s);              // free slot first
    if (i < 0) i = stageSpeaker === 0 ? 1 : 0;      // else evict the listener
    stageSlots[i] = { cid: who, expr: b.expr };
  } else if (b.expr) {
    stageSlots[i].expr = b.expr;
  }
  stageSpeaker = i;
  layoutCast();
}
async function typeText(el, text) {
  typing = true; el.textContent = "";
  for (const ch of (text || "")) {
    if (!typing) { el.textContent = text; break; }   // tap-to-complete
    el.textContent += ch;
    await new Promise(r => setTimeout(r, "，。！？…、".includes(ch) ? 90 : 26));
  }
  typing = false;
}
async function showBeat(b) {
  setBg(b.scene);
  setStage(b);
  const nm = $("gname"), tx = $("gtext");
  if (b.who) { nm.textContent = b.who === W.protagonist_id ? "你" : nameOf(b.who); nm.style.display = ""; tx.className = ""; }
  else { nm.style.display = "none"; tx.className = "narr"; }
  $("gnext").style.visibility = "hidden";
  await typeText(tx, b.text);
  if (!choosing) $("gnext").style.visibility = "visible";
  logAdd(b);
  if (autoOn && !choosing) { clearTimeout(autoT); autoT = setTimeout(next, 1100 + (b.text || "").length * 60); }
}

function next() {
  if (typing) { typing = false; return; }
  if (choosing) return;                    // options are the only way forward
  if (sav.br) {                            // inside a choice branch
    const c = curChoice(sav.br.q), opt = c && c.options[sav.br.o];
    if (opt) {
      sav.br.j++;
      if (sav.br.j < opt.beats.length) { save(); showBeat(opt.beats[sav.br.j]); return; }
    }
    sav.br = null;                         // branch exhausted → rejoin the main line
  }
  sav.i++;
  const list = listNow();
  if (sav.i >= list.length) {
    if (sav.end) { finish(); return; }
    if (sav.ch + 1 >= chapters().length) { startEnding(); return; }
    sav.ch++; sav.i = -1; save();
    showBeat(chapterCard(`· 第 ${sav.ch + 1} 章 ·`)); return;
  }
  const b = list[sav.i];
  if (b.type === "choice") { save(); showChoice(b); return; }
  save(); showBeat(b);
}
function chapterCard(text) {
  const b0 = listNow().find(x => x.type !== "choice") || {};
  return { who: null, text, scene: b0.scene };
}

// 🎯 选择点: apply fx to the affinity ledger, play the branch, rejoin
function showChoice(c) {
  choosing = true; clearTimeout(autoT);
  $("gnext").style.visibility = "hidden";
  const box = $("gchoice"); box.innerHTML = "";
  c.options.forEach((o, k) => {
    const btn = document.createElement("button");
    btn.textContent = o.text;
    btn.onclick = ev => { ev.stopPropagation(); pick(c, k); };
    box.appendChild(btn);
  });
  box.style.display = "flex";
}
function pick(c, k) {
  const o = c.options[k];
  choosing = false; $("gchoice").style.display = "none";
  sav.picks[c.id] = k;
  const fx = o.fx || {};
  for (const cid in fx) sav.vals[cid] = (sav.vals[cid] || 0) + fx[cid];
  logPick(o.text);
  if (o.beats && o.beats.length) { sav.br = { q: c.id, o: k, j: 0 }; save(); showBeat(o.beats[0]); }
  else { sav.br = null; save(); next(); }
}

// 🏁 结局: the engine's threshold decides; the fork the whole ledger was for
function startEnding() {
  if (!W.endings || !W.endings.length) { finishSimple("全剧终"); return; }
  const e = pickEnding();
  sav.end = e.id; sav.i = -1; save();
  showBeat({ who: null, text: "· 终章 ·", scene: (e.beats[0] || {}).scene });
}
function pickEnding() {
  for (const e of W.endings) {
    const c = e.cond || {};
    if (c.char && (sav.vals[c.char] || 0) >= c.gte) return e;
  }
  return W.endings.find(e => (e.cond || {}).default) || W.endings[W.endings.length - 1];
}
function finish() {
  const e = endingById(sav.end);
  const got = unlocked();
  if (e && !got.includes(e.id)) { got.push(e.id); localStorage.setItem(EKEY(), JSON.stringify(got)); }
  localStorage.removeItem(SKEY()); $("btnCont").style.display = "none";
  const n = (W.endings || []).length;
  $("gendT").textContent = e ? `结局 · ${e.title}` : "全剧终";
  $("gendS").textContent = n ? `已解锁 ${got.length}/${n} 个结局` +
    (got.length < n ? "，另一个藏在不同的选择里" : "") : "";
  $("gend").style.display = "flex";
}
function finishSimple(t) {
  localStorage.removeItem(SKEY()); $("btnCont").style.display = "none";
  $("gendT").textContent = t; $("gendS").textContent = "";
  $("gend").style.display = "flex";
}

function tap() {
  if ($("gtitle").style.display !== "none" || $("gend").style.display === "flex") return;
  next();
}
function restart() { $("gend").style.display = "none"; sav = fresh(); choosing = false; clearCast(); next(); }
function toggleAuto() { autoOn = !autoOn; $("btnAuto").classList.toggle("on", autoOn); if (autoOn && !typing && !choosing) next(); }
function logAdd(b) {
  const d = document.createElement("div"); d.className = "l";
  d.innerHTML = (b.who ? `<b>${b.who === W.protagonist_id ? "你" : nameOf(b.who)}</b>` : "") +
                (b.text || "").replace(/</g, "&lt;");
  $("glog").appendChild(d);
}
function logPick(text) {
  const d = document.createElement("div"); d.className = "l pick";
  d.textContent = "▸ 你的选择：" + text;
  $("glog").appendChild(d);
}
function toggleLog() { const l = $("glog"); l.style.display = l.style.display === "block" ? "none" : "block"; l.scrollTop = l.scrollHeight; }
document.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); tap(); } });
boot();
</script>
</body>
</html>
