<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>🎀 LinguisPlay Gal</title>
<style>
  /* ── design tokens: 一套皮一个声音 ─────────────────────────────────────────
     accent 淡金 / warm-ink 文字 / 衬线只给标题与名牌 / 面板一律渐变无描边 */
  :root { --gold: #d8b57a; --gold-dim: rgba(216,181,122,.45);
          --ink: #ece9e2; --ink-dim: rgba(236,233,226,.52);
          --pane: rgba(6,7,12,.94);
          --serif: "Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,"SimSun",serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: var(--ink); overflow: hidden;
               font: 15px/1.8 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* 📱 the phone stage: 9:16, centered; everything outside is pure black */
  #stage { position: relative; aspect-ratio: 9/16; height: min(100vh, 177.7vw);
           margin: 0 auto; top: 50%; transform: translateY(-50%);
           overflow: hidden; background: #05050a; user-select: none; cursor: pointer; }
  #gbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
         transition: opacity .6s ease; }
  /* 🎭 双立绘位: 竖屏不平分左右（脸会小），前后景深错位 + Auto Highlight
     （说话者前景点亮，另一位缩小压暗置后；位置一旦分定不再交换，防跳动） */
  /* 呼吸=以脚底为轴的极微纵向缩放(肩膀起伏, 脚钉在地上) — 整体平移会变成飘 */
  .sp { position: absolute; bottom: 24%; transform: translateX(-50%);
        transform-origin: 50% 100%;
        max-width: 92%; object-fit: contain; object-position: bottom;
        transition: opacity .35s ease, left .3s ease, height .3s ease, filter .3s ease;
        animation: breathe 5.2s ease-in-out infinite; }
  @keyframes breathe { 50% { scale: 1 1.006; } }
  .sp.back { animation-duration: 6.6s; }                  /* 前后景呼吸错拍 */
  #stage.nomotion .sp { animation: none; }                /* ⚙ 立绘动效可关 */
  /* 🎬 演出小件: 震动 + 白闪/黑闪 */
  @keyframes shake { 20% { left: -9px; } 45% { left: 8px; } 70% { left: -5px; }
                     90% { left: 3px; } 100% { left: 0; } }
  #stage.shaking { animation: shake .4s ease; }
  #gflash { position: absolute; inset: 0; z-index: 7; opacity: 0; pointer-events: none;
            transition: opacity .55s ease; }
  .sp.center { left: 50%; }
  .sp.left   { left: 32%; }
  .sp.right  { left: 68%; }
  .sp.front  { height: 60%; z-index: 3;
               filter: brightness(1) drop-shadow(0 6px 22px rgba(0,0,0,.55)); }
  .sp.back   { height: 51%; z-index: 2;
               filter: brightness(.45) drop-shadow(0 6px 22px rgba(0,0,0,.55)); }
  .sp.front.dim { filter: brightness(.72) drop-shadow(0 6px 22px rgba(0,0,0,.55)); }
  .off { opacity: 0 !important; }
  /* 📸 CG 全屏插画: covers the stage above sprites, below text & controls */
  #gcg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
         z-index: 4; transition: opacity .5s ease; }
  /* 💬 对话面板: 底部渐变, 无描边无圆角盒 — 电影字幕式的沉入感 */
  #gbox { position: absolute; left: 0; right: 0; bottom: 0; min-height: 31%;
          z-index: 5; padding: 40px 7% calc(20px + env(safe-area-inset-bottom));
          background: linear-gradient(180deg, rgba(4,5,10,0) 0%,
                      rgba(4,5,10,.62) 22%, rgba(4,5,10,.95) 58%); }
  #gname { display: inline-block; font-family: var(--serif); font-size: 15px;
           letter-spacing: 3px; color: var(--gold); padding-bottom: 3px;
           margin-bottom: 8px; border-bottom: 1px solid var(--gold-dim); }
  #gtext { font-size: 15.5px; line-height: 2; min-height: 4.4em;
           text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #gtext.narr { color: rgba(236,233,226,.78); }
  #gnext { position: absolute; right: 7%; bottom: calc(14px + env(safe-area-inset-bottom));
           color: var(--gold); font-size: 11px;
           animation: pulse 1.6s ease-in-out infinite; visibility: hidden; }
  @keyframes pulse { 50% { opacity: .15; transform: translateY(2px); } }
  /* 📱 顶栏: 幽灵文字键 — 无框无底, 字距撑排版感; 返回独立左上; 避让刘海 */
  #gback { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 14px;
           z-index: 5; font-size: 12px; letter-spacing: 2px; color: var(--ink-dim);
           cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,.9); padding: 6px 4px; }
  #gback:hover { color: var(--gold); }
  #gctl { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px;
          display: flex; gap: 15px; z-index: 5; flex-wrap: wrap;
          justify-content: flex-end; max-width: 74%; }
  #gctl span { font-size: 11px; letter-spacing: 2px; color: var(--ink-dim);
               cursor: pointer; padding: 6px 1px; line-height: 1;
               text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  #gctl span:hover { color: var(--ink); }
  #gctl span.on { color: var(--gold); }
  /* 🎯 选择点: 细金线夹着的半透明横幅 */
  #gchoice { position: absolute; left: 9%; right: 9%; bottom: 34%; z-index: 6;
             display: none; flex-direction: column; gap: 13px; }
  #gchoice button { background: linear-gradient(90deg, rgba(8,9,15,0),
                      rgba(8,9,15,.88) 14%, rgba(8,9,15,.88) 86%, rgba(8,9,15,0));
                    border: 0; border-top: 1px solid var(--gold-dim);
                    border-bottom: 1px solid var(--gold-dim);
                    color: var(--ink); padding: 13px 12px; font: inherit;
                    font-size: 14.5px; letter-spacing: 1px; cursor: pointer;
                    text-align: center; }
  #gchoice button:hover { color: var(--gold); }
  /* 标题画面: 衬线大标题 + 细金线 + 幽灵菜单 */
  #gtitle { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            padding-bottom: calc(11% + env(safe-area-inset-bottom));
            background: #05050a; background-size: cover; background-position: center; }
  #gtitle::before { content: ""; position: absolute; inset: 0;
                    background: linear-gradient(rgba(3,3,8,.15) 30%, rgba(3,3,8,.93)); }
  #gtitle h1 { position: relative; font-family: var(--serif); font-weight: 600;
               font-size: 30px; letter-spacing: 8px; text-indent: 8px;
               text-shadow: 0 2px 14px rgba(0,0,0,.95); margin-bottom: 10px; }
  #gtitle h1::after { content: ""; display: block; width: 44px; height: 1px;
                      background: var(--gold-dim); margin: 14px auto 0; }
  #gtitle .muted { position: relative; letter-spacing: 2px; margin-bottom: 12px; }
  #gtitle button { position: relative; background: none; border: 0; color: var(--ink-dim);
                   margin-top: 15px; padding: 4px 20px; font: inherit; font-size: 15px;
                   letter-spacing: 7px; text-indent: 7px; cursor: pointer;
                   text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  #gtitle button:hover { color: var(--gold); }
  /* 🎬 章节过场卡: 衬线章题 + 细线装饰 */
  #gchap { position: absolute; inset: 0; z-index: 9; display: none; flex-direction: column;
           align-items: center; justify-content: center; background: #000;
           text-align: center; opacity: 0; transition: opacity .5s ease; padding: 0 10%; }
  #gchap .num { font-size: 12px; letter-spacing: 11px; text-indent: 11px;
                color: var(--ink-dim); margin-bottom: 18px; }
  #gchap .num::after { content: ""; display: block; width: 30px; height: 1px;
                       background: var(--gold-dim); margin: 16px auto 0; }
  #gchap h2 { font-family: var(--serif); font-weight: 600; font-size: 26px;
              letter-spacing: 7px; text-indent: 7px; margin-bottom: 20px; min-height: 1em; }
  #gchap .lead { color: var(--ink-dim); font-size: 13.5px; letter-spacing: 2px; }
  #gchap .date { color: var(--gold); font-size: 12px; letter-spacing: 4px;
                 margin-bottom: 12px; }
  /* 📅 时间跳跃横幅: 左侧金线示意, 无框 */
  #gdate { position: absolute; top: calc(52px + env(safe-area-inset-top)); left: 0;
           z-index: 6; padding: 5px 18px 5px 16px; font-size: 12.5px; letter-spacing: 3px;
           color: var(--gold); border-left: 2px solid var(--gold);
           background: linear-gradient(90deg, rgba(4,5,10,.85), rgba(4,5,10,0));
           opacity: 0; transition: opacity .5s ease; pointer-events: none; }
  #gend { position: absolute; inset: 0; z-index: 9; display: none; flex-direction: column;
          align-items: center; justify-content: center; background: rgba(3,3,8,.93); }
  #gend h2 { font-family: var(--serif); font-weight: 600; font-size: 24px;
             letter-spacing: 7px; text-indent: 7px; margin-bottom: 20px; }
  #gend .muted, .muted { color: var(--ink-dim); font-size: 13px; letter-spacing: 1px; }
  #gend button { margin-top: 26px; background: none; color: var(--ink-dim);
                 border: 1px solid rgba(236,233,226,.25); border-radius: 2px;
                 padding: 10px 34px; font: inherit; font-size: 14px;
                 letter-spacing: 5px; text-indent: 5px; cursor: pointer; }
  #gend button:hover { color: var(--gold); border-color: var(--gold-dim); }
  #glog { position: absolute; inset: 0; z-index: 8; display: none; overflow-y: auto;
          background: rgba(4,5,10,.97);
          padding: calc(50px + env(safe-area-inset-top)) 8% 26px; }
  #glog .l { margin-bottom: 13px; font-size: 14px; color: rgba(236,233,226,.82);
             padding-bottom: 13px; border-bottom: 1px solid rgba(236,233,226,.07); }
  #glog .l b { color: var(--gold); margin-right: 8px; font-family: var(--serif); }
  #glog .l.pick { color: var(--gold); }
  /* 📖 图鉴与面板 */
  .book { position: absolute; inset: 0; z-index: 11; display: none; overflow-y: auto;
          background: rgba(4,5,10,.97);
          padding: calc(24px + env(safe-area-inset-top)) 7% 26px; }
  .book h3 { font-family: var(--serif); font-weight: 600; font-size: 17px;
             letter-spacing: 4px; margin: 4px 0 6px; color: var(--ink); }
  .book h3::after { content: ""; display: block; width: 100%; height: 1px;
                    background: linear-gradient(90deg, var(--gold-dim), transparent);
                    margin-top: 10px; }
  .book { --x: 1; }
  .book .x { float: right; color: var(--ink-dim); cursor: pointer; font-size: 14px;
             letter-spacing: 0; font-family: system-ui; }
  #ggrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
  #ggrid img, #ggrid .lock { width: 100%; aspect-ratio: 9/16; object-fit: cover;
          border-radius: 2px; border: 1px solid rgba(236,233,226,.12); cursor: pointer; }
  #ggrid .lock { display: flex; align-items: center; justify-content: center;
          background: #0a0b12; color: rgba(236,233,226,.2); font-size: 22px; cursor: default; }
  #gedb .e, #gset .e, #ghearts .e { padding: 14px 2px; font-size: 15px;
          border-bottom: 1px solid rgba(236,233,226,.08); }
  #gedb .e.got { color: var(--gold); }
  #gview { position: absolute; inset: 0; z-index: 12; display: none;
           background: #000; cursor: pointer; }
  #gview img { width: 100%; height: 100%; object-fit: contain; }
  input[type=range] { accent-color: var(--gold); }
</style>
</head>
<body>
<div id="stage" onclick="tap()">
  <img id="gbg" alt="">
  <img id="gsp0" class="sp off" alt="">
  <img id="gsp1" class="sp off" alt="">
  <img id="gcg" class="off" alt="">
  <span id="gback" onclick="event.stopPropagation();location.href='/gal'">‹ 返回</span>
  <div id="gctl">
    <span onclick="event.stopPropagation();openHearts()" title="心动记录">心动</span>
    <span id="btnAuto" onclick="event.stopPropagation();toggleAuto()" title="自动播放">自动</span>
    <span id="btnSkip" onclick="event.stopPropagation();toggleSkip()" title="已读跳过">跳过</span>
    <span onclick="event.stopPropagation();ffwd()" title="快进到下个选择">快进</span>
    <span onclick="event.stopPropagation();openSettings()" title="设置">设定</span>
    <span id="btnBgm" onclick="event.stopPropagation();bgmToggle()" title="背景音乐">音乐</span>
    <span onclick="event.stopPropagation();toggleLog()" title="回想">记录</span>
  </div>
  <div id="glog" onclick="event.stopPropagation();toggleLog()"></div>
  <div id="ggal" class="book" onclick="event.stopPropagation()">
    <h3><span class="x" onclick="closeBooks()">✕</span>回忆册 <span class="muted">GALLERY</span></h3>
    <div id="ggrid"></div>
  </div>
  <div id="gedb" class="book" onclick="event.stopPropagation()">
    <h3><span class="x" onclick="closeBooks()">✕</span>结局图鉴 <span class="muted">ENDINGS</span></h3>
    <div id="gends"></div>
  </div>
  <div id="gview" onclick="event.stopPropagation();this.style.display='none'"><img alt=""></div>
  <div id="gchoice"></div>
  <div id="gbox">
    <div id="gname" style="display:none"></div>
    <div id="gtext"></div>
    <div id="gnext">▼</div>
  </div>
  <div id="gdate"></div>
  <div id="gflash"></div>
  <div id="gset" class="book" onclick="event.stopPropagation()">
    <h3><span class="x" onclick="this.closest('.book').style.display='none'">✕</span>设定 <span class="muted">CONFIG</span></h3>
    <div class="e">文字速度<br>
      <input id="cfgSpeed" type="range" min="0.5" max="3" step="0.25" style="width:100%" oninput="cfgChange()"></div>
    <div class="e">背景音乐音量<br>
      <input id="cfgBgm" type="range" min="0" max="0.6" step="0.05" style="width:100%" oninput="cfgChange()"></div>
    <div class="e">音效音量<br>
      <input id="cfgSfx" type="range" min="0" max="1" step="0.1" style="width:100%" oninput="cfgChange()"></div>
    <div class="e"><label style="cursor:pointer">
      <input id="cfgMotion" type="checkbox" onchange="cfgChange()"> 立绘呼吸动效</label></div>
  </div>
  <div id="ghearts" class="book" onclick="event.stopPropagation()">
    <h3><span class="x" onclick="this.closest('.book').style.display='none'">✕</span>心动记录 <span class="muted">AFFECTION</span></h3>
    <div id="gheartRows"></div>
  </div>
  <div id="gchap"><div class="num" id="gchapNum"></div><div class="date" id="gchapD"></div>
    <h2 id="gchapT"></h2><div class="lead" id="gchapL"></div></div>
  <div id="gend"><h2 id="gendT"></h2><div class="muted" id="gendS"></div>
    <button onclick="event.stopPropagation();restart()">从头再看</button></div>
  <div id="gtitle">
    <h1 id="gt"></h1>
    <div class="muted" id="gtEnds"></div>
    <button onclick="event.stopPropagation();startGame(false)">开 始</button>
    <button id="btnCont" style="display:none" onclick="event.stopPropagation();startGame(true)">继 续</button>
    <button id="btnGal" style="display:none" onclick="event.stopPropagation();openGallery()">📸 CG 回忆册</button>
    <button id="btnEdb" style="display:none" onclick="event.stopPropagation();openEndbook()">🏁 结局图鉴</button>
  </div>
</div>
<script>
const API = "/api/v1";
const workId = new URLSearchParams(location.search).get("work");
let W = null, sav = null, typing = false, autoOn = false, autoT = null, choosing = false;
const $ = id => document.getElementById(id);
const SKEY = () => "gal_sav_" + workId;
const EKEY = () => "gal_end_" + workId;
const CGKEY = () => "gal_cg_" + workId;
const RKEY = () => "gal_read_" + workId;
const chapters = () => ((W.script[W.protagonist_id] || {}).chapters) || [];

// 🎵 BGM: 情绪标签 → 主站曲库; 渐入渐出, 音量压低 (突然炸响是大忌)
// 曲库: 甘茶の音楽工房 (amachamusic.chagasi.com, 免费商用无需署名) — gal_ 前缀;
// 主站合成器旧曲留作兜底 (gal_ 文件缺失时 onerror 回退)
const BGM_MAP = { "平静": "gal_daily", "温馨": "gal_warm", "浪漫": "gal_romantic",
                  "紧张": "gal_tense", "悲伤": "gal_sad", "寂寞": "gal_lonely",
                  "悬疑": "gal_mystery", "激昂": "gal_battle" };
const BGM_VOL = () => CFG.bgm;   // 分轨音量走全局设置
let bgm = null, bgmTrack = "", bgmOn = localStorage.getItem("gal_bgm") !== "off", fadeT = null;
function bgmToggle() {
  bgmOn = !bgmOn;
  localStorage.setItem("gal_bgm", bgmOn ? "on" : "off");
  $("btnBgm").classList.toggle("on", bgmOn);
  if (!bgmOn && bgm) bgm.pause();
  else if (bgm && bgmTrack) bgm.play().catch(() => {});
}
function setBgm(mood) {
  const t = BGM_MAP[mood];
  if (!t || t === bgmTrack) return;
  bgmTrack = t;
  if (!bgmOn) return;
  if (!bgm) { bgm = new Audio(); bgm.loop = true; }
  clearInterval(fadeT);
  const start = () => {
    // gal_ 曲子缺失时回退主站旧曲 (去掉 gal_ 前缀)
    bgm.onerror = () => {
      if (t.startsWith("gal_")) { bgm.src = `/scene/bgm/${t.slice(4)}.mp3`;
                                  bgm.play().catch(() => { bgmTrack = ""; }); }
    };
    bgm.src = `/scene/bgm/${t}.mp3`; bgm.volume = 0;
    // autoplay 被拦(定时器链里没有用户手势)时清掉曲目记账, 下一次点击重试
    bgm.play().catch(() => { bgmTrack = ""; });
    fadeT = setInterval(() => {
      bgm.volume = Math.min(BGM_VOL(), bgm.volume + 0.02);
      if (bgm.volume >= BGM_VOL()) clearInterval(fadeT);
    }, 80);
  };
  if (bgm.src && !bgm.paused) {
    fadeT = setInterval(() => {           // crossfade: out the old, in the new
      bgm.volume = Math.max(0, bgm.volume - 0.03);
      if (bgm.volume <= 0) { clearInterval(fadeT); start(); }
    }, 60);
  } else start();
}

// 📸 CG 解锁册 + 📖 既读账本
function cgGot() { try { return JSON.parse(localStorage.getItem(CGKEY()) || "[]"); } catch (e) { return []; } }
let readSet = new Set(), skipOn = false;
try { readSet = new Set(JSON.parse(localStorage.getItem(RKEY()) || "[]")); } catch (e) {}
function markRead(id) {
  if (!id || readSet.has(id)) return;
  readSet.add(id);
  localStorage.setItem(RKEY(), JSON.stringify([...readSet]));
}
function toggleSkip() {
  skipOn = !skipOn;
  $("btnSkip").classList.toggle("on", skipOn);
  if (skipOn && !typing && !choosing) next();
}
// ⏭ 快进到下个选择: 静默推进 (记既读+进回想), 在选择/CG/章界/结局处停下
function ffwd() {
  if (!sav || chapCardOn || choosing) return;
  typing = false;
  clearTimeout(autoT);
  for (let guard = 0; guard < 600; guard++) {
    if (sav.br) {
      const c = curChoice(sav.br.q), opt = c && c.options[sav.br.o];
      if (opt && sav.br.j + 1 < opt.beats.length) {
        sav.br.j++;
        const bb = opt.beats[sav.br.j];
        markRead(bb.id); logAdd(bb);
        if (bb.cg) { save(); showBeat(bb); return; }
        continue;
      }
      sav.br = null;
    }
    sav.i++;
    const list = listNow();
    while (sav.i < list.length && list[sav.i].type !== "choice" && !flagOk(list[sav.i]))
      sav.i++;
    if (sav.i >= list.length) {
      if (sav.end) { save(); finish(); return; }
      if (sav.ch + 1 >= chapters().length) { save(); startEnding(); return; }
      sav.ch++; sav.i = -1; save();
      showChapCard(sav.ch, false); return;
    }
    const b = list[sav.i];
    if (b.type === "choice") { save(); showChoice(b); return; }
    markRead(b.id); logAdd(b);
    if (b.cg) { save(); showBeat(b); return; }   // CG 是奖励, 不快进糊脸
  }
  save(); showCurrent();
}
function setCg(b) {
  const el = $("gcg");
  if (!(b.cg && ((W.manifest || {}).cgs || []).includes(b.id))) { el.classList.add("off"); return; }
  el.onerror = () => el.classList.add("off");
  el.src = `/scene/gal/${workId}/cg_${b.id}.jpg`;
  el.classList.remove("off");
  const got = cgGot();
  if (!got.includes(b.id)) { got.push(b.id); localStorage.setItem(CGKEY(), JSON.stringify(got)); }
}

async function boot() {
  if (!workId) { location.href = "/maker"; return; }
  let r = await fetch(`${API}/gal/${workId}/script`);
  if (r.status === 401) { location.href = "/play"; return; }
  if (!r.ok) { $("gt").textContent = "作品还没准备好"; return; }
  W = await r.json();
  $("gt").textContent = W.title || "";
  $("gtitle").style.backgroundImage =
    W.manifest && W.manifest.cover ? `url(/scene/gal/${workId}/cover.jpg)` : "";
  const n = (W.endings || []).length;
  if (n) $("gtEnds").textContent = `已解锁 ${unlocked().length}/${n} 个结局`;
  if (localStorage.getItem(SKEY()) !== null) $("btnCont").style.display = "";
  if (((W.manifest || {}).cgs || []).length) $("btnGal").style.display = "";
  if (n) $("btnEdb").style.display = "";
  $("btnBgm").classList.toggle("on", bgmOn);   // 🔊 初始就亮出开关状态
  applyMotion();
  preloadAssets();
}
// 🚚 后台预载: 开场就把整本书的图拖回本地缓存 (跨洋链路一次换场 3MB 的解药),
// 两条并发慢慢拉, 不跟正在看的图抢带宽
function preloadAssets() {
  const urls = [];
  ((W.scenes) || []).forEach(s => urls.push(`/scene/gal/${workId}/bg_${s.id}.jpg`));
  const spr = (W.manifest || {}).sprites || {};
  Object.keys(spr).forEach(cid =>
    (spr[cid] || []).forEach(e => urls.push(`/scene/gal/${workId}/${cid}_${e}.webp`)));
  ((W.manifest || {}).cgs || []).forEach(id => urls.push(`/scene/gal/${workId}/cg_${id}.jpg`));
  let i = 0;
  const pump = () => {
    if (i >= urls.length) return;
    const im = new Image();
    im.onload = im.onerror = () => setTimeout(pump, 80);
    im.src = urls[i++];
  };
  pump(); pump();
}
// 📸🏁 图鉴
function openGallery() {
  const got = cgGot();
  $("ggrid").innerHTML = (W.manifest.cgs || []).map(id =>
    got.includes(id)
      ? `<img src="/scene/gal/${workId}/cg_${id}.jpg" onclick="viewCg('${id}')">`
      : `<div class="lock">？</div>`).join("");
  $("ggal").style.display = "block";
}
function openEndbook() {
  const got = unlocked();
  $("gends").innerHTML = (W.endings || []).map(e =>
    got.includes(e.id) ? `<div class="e got">✦ ${e.title}</div>`
                       : `<div class="e">？？？</div>`).join("")
    + `<div class="muted" style="margin-top:12px">${endingHint(got)}</div>`;
  $("gedb").style.display = "block";
}
function closeBooks() { $("ggal").style.display = "none"; $("gedb").style.display = "none"; }
function viewCg(id) {
  const v = $("gview");
  v.querySelector("img").src = `/scene/gal/${workId}/cg_${id}.jpg`;
  v.style.display = "block";
}
// 🧭 结局回收导航: which chapters' choices move the route ledger
function endingHint(got) {
  const n = (W.endings || []).length;
  if (!n || got.length >= n) return "";
  const tgt = ((W.endings.find(e => (e.cond || {}).char) || {}).cond || {}).char;
  if (!tgt) return "";
  const chs = [];
  chapters().forEach((list, k) => {
    if (list.some(e => e.type === "choice" &&
        (e.options || []).some(o => (o.fx || {})[tgt] !== undefined))) chs.push(k + 1);
  });
  return chs.length
    ? `分岔藏在第 ${chs.join("、")} 章的选择里，开 ⏩ 已读跳过快速重走`
    : "";
}
function unlocked() {
  try { return JSON.parse(localStorage.getItem(EKEY()) || "[]"); } catch (e) { return []; }
}
function fresh() { return { ch: 0, i: -1, br: null, end: null, vals: {}, picks: {}, flags: {} }; }
// 🚩 flag 条件拍: require="标记名" 只在立过时演, "!标记名" 只在没立过时演
function flagOk(b) {
  const r = b.require;
  if (!r) return true;
  const flags = (sav && sav.flags) || {};
  return r[0] === "!" ? !flags[r.slice(1)] : !!flags[r];
}
function save() { localStorage.setItem(SKEY(), JSON.stringify(sav)); }
function nameOf(cid) { const c = (W.characters || []).find(x => x.id === cid); return c ? c.name : ""; }
function curChoice(qid) {
  return (chapters()[sav.ch] || []).find(e => e.type === "choice" && e.id === qid);
}
function endingById(id) { return (W.endings || []).find(e => e.id === id); }
function listNow() {
  if (sav.end) { const e = endingById(sav.end); return e ? e.beats : []; }
  return chapters()[sav.ch] || [];
}

function startGame(cont) {
  $("gtitle").style.display = "none";
  $("gend").style.display = "none";
  let saved = null;
  if (cont) { try { saved = JSON.parse(localStorage.getItem(SKEY()) || "null"); } catch (e) {} }
  const resumed = saved && typeof saved === "object" && "ch" in saved;
  sav = resumed ? saved : fresh();
  choosing = false;
  clearCast();
  // 借「开始」这次点击的手势把第一首 BGM 拉起来 (过场卡的定时器链没有手势权限)
  const ch0 = chapters()[sav.ch] || [];
  const firstMood = (ch0.find(b => b.type !== "choice" && b.bgm) || {}).bgm;
  if (firstMood) setBgm(firstMood);
  if (resumed) showCurrent();
  else showChapCard(0, false);   // 开卷也有过场: 第一章的章节卡
}
// continue lands back ON the beat that was last shown, not one past it
function showCurrent() {
  if (sav.br) {
    const c = curChoice(sav.br.q), opt = c && c.options[sav.br.o];
    if (opt && opt.beats[sav.br.j]) { showBeat(opt.beats[sav.br.j]); return; }
    sav.br = null;
  }
  const list = listNow();
  if (sav.i < 0 || sav.i >= list.length) { next(); return; }
  const b = list[sav.i];
  if (b.type === "choice") { showChoice(b); return; }
  showBeat(b);
}

function setBg(sid, trans) {
  if (!sid) return;                       // synthetic cards keep the current bg
  const el = $("gbg");
  const want = `/scene/gal/${workId}/bg_${sid}.jpg`;
  if (el.dataset.sid === sid) return;
  clearCast();                            // 换场清台：人随新场景重新登场
  el.dataset.sid = sid;
  const swap = () => { el.onerror = () => { el.removeAttribute("src"); el.style.opacity = 1; };
                       el.src = want; el.onload = () => el.style.opacity = 1; };
  // 🎬 转场库: 时间跳跃走黑场切, 白闪伴随走白场切, 普通换景走溶解
  if (trans === "black" || trans === "white") {
    const f = $("gflash");
    f.style.background = trans === "white" ? "#fff" : "#000";
    f.style.transition = "opacity .3s ease"; f.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; swap();
                       setTimeout(() => { f.style.transition = "opacity .7s ease";
                                          f.style.opacity = 0; }, 260); }, 320);
  } else {
    el.style.opacity = 0;
    setTimeout(swap, 320);
  }
}
// 🎭 舞台账本: 最近两个开口的非主角占左右槽（播放器侧从 who 序列推导——
// 结构性要求不押在编译模型的自觉上）。槽位一经分定不再交换；第三人开口顶掉
// 此刻没在说话的那位；换场清台。
const spEls = () => [$("gsp0"), $("gsp1")];
let stageSlots = [null, null], stageSpeaker = -1;

function clearCast() {
  stageSlots = [null, null]; stageSpeaker = -1;
  spEls().forEach(el => el.classList.add("off"));
  $("gcg").classList.add("off");
}
function setSrc(el, cid, expr) {
  probeBlink(cid);
  const want = `/scene/gal/${workId}/${cid}_${expr || "常态"}.webp`;
  const fallback = `/scene/gal/${workId}/${cid}_常态.webp`;
  el.onerror = () => {   // a missing expression falls back to 常态, then hides
    if (want !== fallback && el.getAttribute("src") !== location.origin + fallback) {
      el.onerror = () => el.classList.add("off");
      el.src = fallback;
    } else el.classList.add("off");
  };
  if (el.getAttribute("src") !== location.origin + want) el.src = want;
}
function layoutCast() {
  const n = stageSlots.filter(Boolean).length;
  stageSlots.forEach((s, i) => {
    const el = spEls()[i];
    if (!s) { el.classList.add("off"); return; }
    setSrc(el, s.cid, s.expr);
    el.classList.remove("off", "left", "right", "center", "front", "back", "dim");
    if (n === 1) { el.classList.add("center", "front"); return; }
    el.classList.add(i === 0 ? "left" : "right",
                     i === stageSpeaker ? "front" : "back");
  });
}
function setStage(b) {
  // 🔞 成人拍：只有背景+文字框（Yi 拍板）；主角与旁白也不上立绘
  if (b.adult) { spEls().forEach(el => el.classList.add("off")); return; }
  const who = b.who;
  if (!who || who === W.protagonist_id) {
    // 旁白/主角开口：在场者保持站位，整体轻压一档（都在听）
    spEls().forEach(el => { if (!el.classList.contains("off")) el.classList.add("dim"); });
    return;
  }
  let i = stageSlots.findIndex(s => s && s.cid === who);
  if (i < 0) {
    i = stageSlots.findIndex(s => !s);              // free slot first
    if (i < 0) i = stageSpeaker === 0 ? 1 : 0;      // else evict the listener
    stageSlots[i] = { cid: who, expr: b.expr };
  } else if (b.expr) {
    stageSlots[i].expr = b.expr;
  }
  stageSpeaker = i;
  layoutCast();
}
async function typeText(el, text) {
  typing = true; el.textContent = "";
  for (const ch of (text || "")) {
    if (!typing) { el.textContent = text; break; }   // tap-to-complete
    el.textContent += ch;
    await new Promise(r => setTimeout(r, ("，。！？…、".includes(ch) ? 90 : 26) / CFG.speed));
  }
  typing = false;
}
// ⚙ 全局设置: 文字速度 + 分轨音量 (localStorage 全局持久)
let CFG = { speed: 1, bgm: 0.22, sfx: 0.5, motion: 1 };
try { CFG = { ...CFG, ...JSON.parse(localStorage.getItem("gal_cfg") || "{}") }; } catch (e) {}
function saveCfg() { localStorage.setItem("gal_cfg", JSON.stringify(CFG)); }
function applyMotion() { $("stage").classList.toggle("nomotion", !CFG.motion); }
function openSettings() {
  $("gset").style.display = "block";
  $("cfgSpeed").value = CFG.speed; $("cfgBgm").value = CFG.bgm; $("cfgSfx").value = CFG.sfx;
  $("cfgMotion").checked = !!CFG.motion;
}
function cfgChange() {
  CFG.speed = +$("cfgSpeed").value; CFG.bgm = +$("cfgBgm").value; CFG.sfx = +$("cfgSfx").value;
  CFG.motion = $("cfgMotion").checked ? 1 : 0;
  if (bgm && !bgm.paused) bgm.volume = CFG.bgm;
  applyMotion();
  saveCfg();
}

// 👀 眨眼 (E-mote 丐版): 有闭眼帧的角色每隔几秒快速切一下
const blinkable = {};
function probeBlink(cid) {
  if (cid in blinkable) return;
  blinkable[cid] = false;
  const im = new Image();
  im.onload = () => { blinkable[cid] = true; };
  im.src = `/scene/gal/${workId}/${cid}_眨.webp`;
}
setInterval(() => {
  if (skipOn || typing) return;            // 快进/打字中不眨: 拍在飞速换, 别添乱
  stageSlots.forEach((s, i) => {
    if (!s || !blinkable[s.cid] || Math.random() > 0.16) return;
    const el = spEls()[i];
    if (el.classList.contains("off")) return;
    el.src = `/scene/gal/${workId}/${s.cid}_眨.webp`;
    // 恢复从舞台账本实时取表情, 不用旧快照 (实弹: 140ms 里换了拍,
    // 旧快照会把新表情拍回旧表情 → 表情乱闪)
    setTimeout(() => {
      const cur = stageSlots[i];
      if (cur && cur.cid === s.cid) setSrc(el, cur.cid, cur.expr);
    }, 140);
  });
}, 700);

// 🔉 拍级音效: 中文标签 → 主站音效库, 一次性播放
const SFX_MAP = { "雷鸣": "thunder", "雨声": "rain", "风声": "wind", "海浪": "waves",
                  "脚步": "footsteps", "敲门": "knock", "开门": "door", "吱呀": "creak",
                  "翻书": "book", "钟声": "bell", "心跳": "heartbeat", "碎裂": "glass",
                  "爆炸": "explosion", "魔法": "magic", "剑击": "sword", "拳击": "punch",
                  "拔剑": "draw", "交锋": "clash", "硬币": "coin", "铃声": "ringtone" };
function playSfx(tag) {
  const f = SFX_MAP[tag];
  if (!f || !bgmOn) return;
  const a = new Audio(`/scene/sfx/${f}.mp3`);
  a.volume = CFG.sfx;
  a.play().catch(() => {});
}
// 🎬 演出小件
function playFx(fx) {
  if (fx === "震动") {
    const st = $("stage");
    st.classList.remove("shaking"); void st.offsetWidth;   // retrigger
    st.classList.add("shaking");
  } else if (fx === "白闪" || fx === "黑闪") {
    const el = $("gflash");
    el.style.background = fx === "白闪" ? "#fff" : "#000";
    el.style.transition = "none"; el.style.opacity = .92; void el.offsetWidth;
    el.style.transition = "opacity .55s ease"; el.style.opacity = 0;
  }
}
// 💗 心动记录: 好感可视化 (十心制, 按可得上限归一)
function openHearts() {
  const vm = W.values || {};
  const rows = (vm.routes || []).map(cid => {
    const cur = (sav && sav.vals && sav.vals[cid]) || 0;
    const mx = (vm.max || {})[cid] || 1;
    const n = Math.max(0, Math.min(10, Math.round(cur / mx * 10)));
    return `<div class="e"><b>${nameOf(cid)}</b>　` +
      `<span style="color:#ff7d9d">${"♥".repeat(n)}</span>` +
      `<span style="color:#3a3a52">${"♡".repeat(10 - n)}</span></div>`;
  }).join("");
  $("gheartRows").innerHTML = rows || `<div class="muted">这本书没有感情线数值</div>`;
  $("ghearts").style.display = "block";
}
function floatHeart() {         // 选中加分选项时飘一颗心
  const h = document.createElement("div");
  h.textContent = "♥";
  h.style.cssText = "position:absolute;left:50%;bottom:36%;z-index:8;color:#ff7d9d;" +
    "font-size:26px;pointer-events:none;transition:all 1.1s ease;opacity:1";
  $("stage").appendChild(h);
  requestAnimationFrame(() => { h.style.bottom = "48%"; h.style.opacity = 0; });
  setTimeout(() => h.remove(), 1200);
}
let dateT = null;
function showDate(d) {          // 📅 time-skip banner: fade in, hold, fade out
  const el = $("gdate");
  el.textContent = `— ${d} —`;
  el.style.opacity = 1;
  clearTimeout(dateT);
  dateT = setTimeout(() => { el.style.opacity = 0; }, 2200);
}
async function showBeat(b) {
  setBg(b.scene, b.date ? "black" : (b.fx === "白闪" ? "white" : ""));
  setStage(b);
  setCg(b);
  if (b.bgm) setBgm(b.bgm);
  if (b.date) showDate(b.date);
  if (b.sfx) playSfx(b.sfx);
  if (b.fx) playFx(b.fx);
  // ⏩ 既读跳过: synthetic cards (no id) count as read so skip flows through them
  const seen = b.id ? readSet.has(b.id) : true;
  markRead(b.id);
  const nm = $("gname"), tx = $("gtext");
  if (b.who) { nm.textContent = b.who === W.protagonist_id ? "你" : nameOf(b.who); nm.style.display = ""; tx.className = ""; }
  else { nm.style.display = "none"; tx.className = "narr"; }
  $("gnext").style.visibility = "hidden";
  if (skipOn && seen) { typing = false; tx.textContent = b.text || ""; }
  else {
    if (skipOn) { skipOn = false; $("btnSkip").classList.remove("on"); }  // 未读处停跳
    await typeText(tx, b.text);
  }
  if (!choosing) $("gnext").style.visibility = "visible";
  logAdd(b);
  clearTimeout(autoT);
  if (choosing) return;
  if (skipOn && seen) autoT = setTimeout(next, 130);
  else if (autoOn) autoT = setTimeout(next, 1100 + (b.text || "").length * 60);
}

function next() {
  if (chapCardOn) return;                  // the chapter card owns this pause
  if (typing) { typing = false; return; }
  if (choosing) return;                    // options are the only way forward
  if (sav.br) {                            // inside a choice branch
    const c = curChoice(sav.br.q), opt = c && c.options[sav.br.o];
    if (opt) {
      sav.br.j++;
      if (sav.br.j < opt.beats.length) { save(); showBeat(opt.beats[sav.br.j]); return; }
    }
    sav.br = null;                         // branch exhausted → rejoin the main line
  }
  sav.i++;
  const list = listNow();
  while (sav.i < list.length && list[sav.i].type !== "choice" && !flagOk(list[sav.i]))
    sav.i++;                                   // 🚩 条件拍: 条件不满足就静默跳过
  if (sav.i >= list.length) {
    if (sav.end) { finish(); return; }
    if (sav.ch + 1 >= chapters().length) { startEnding(); return; }
    sav.ch++; sav.i = -1; save();
    showChapCard(sav.ch, false); return;
  }
  const b = list[sav.i];
  if (b.type === "choice") { save(); showChoice(b); return; }
  save(); showBeat(b);
}
// 🎬 章节过场卡: 黑场淡入「第 X 章 · 章题 · 引言」, 停一拍再淡出进章
let chapCardOn = false;
const CN = "一二三四五六七八九十";
function showChapCard(k, isFinal) {
  const c = (W.chapters || [])[k] || {};
  $("gchapNum").textContent = isFinal ? "终 章" : `第 ${CN[k] || k + 1} 章`;
  $("gchapD").textContent = isFinal ? "" : (c.date || "");
  $("gchapT").textContent = isFinal ? "" : (c.title || "");
  $("gchapL").textContent = isFinal ? "" : (c.lead || "");
  const el = $("gchap");
  el.style.display = "flex";
  requestAnimationFrame(() => { el.style.opacity = 1; });
  chapCardOn = true;
  clearTimeout(autoT);
  autoT = setTimeout(hideChapCard, skipOn ? 700 : 2600);
}
function hideChapCard() {
  if (!chapCardOn) return;
  chapCardOn = false;
  clearTimeout(autoT);
  const el = $("gchap");
  el.style.opacity = 0;
  setTimeout(() => { el.style.display = "none"; }, 520);
  next();
}

// 🎯 选择点: apply fx to the affinity ledger, play the branch, rejoin
function showChoice(c) {
  choosing = true; clearTimeout(autoT);
  $("gnext").style.visibility = "hidden";
  const box = $("gchoice"); box.innerHTML = "";
  c.options.forEach((o, k) => {
    const btn = document.createElement("button");
    btn.textContent = o.text;
    btn.onclick = ev => { ev.stopPropagation(); pick(c, k); };
    box.appendChild(btn);
  });
  box.style.display = "flex";
}
function pick(c, k) {
  const o = c.options[k];
  choosing = false; $("gchoice").style.display = "none";
  sav.picks[c.id] = k;
  const fx = o.fx || {};
  for (const cid in fx) sav.vals[cid] = (sav.vals[cid] || 0) + fx[cid];
  if (o.flag) (sav.flags = sav.flags || {})[o.flag] = 1;   // 🚩 立下事实标记
  if (Object.values(fx).some(v => v > 0)) floatHeart();     // 💗 加分飘心
  logPick(o.text);
  if (o.beats && o.beats.length) { sav.br = { q: c.id, o: k, j: 0 }; save(); showBeat(o.beats[0]); }
  else { sav.br = null; save(); next(); }
}

// 🏁 结局: the engine's threshold decides; the fork the whole ledger was for
function startEnding() {
  if (!W.endings || !W.endings.length) { finishSimple("全剧终"); return; }
  const e = pickEnding();
  sav.end = e.id; sav.i = -1; save();
  showChapCard(-1, true);
}
function pickEnding() {
  for (const e of W.endings) {
    const c = e.cond || {};
    if (c.char && (sav.vals[c.char] || 0) >= c.gte) return e;
  }
  return W.endings.find(e => (e.cond || {}).default) || W.endings[W.endings.length - 1];
}
function finish() {
  const e = endingById(sav.end);
  const got = unlocked();
  if (e && !got.includes(e.id)) { got.push(e.id); localStorage.setItem(EKEY(), JSON.stringify(got)); }
  localStorage.removeItem(SKEY()); $("btnCont").style.display = "none";
  const n = (W.endings || []).length;
  $("gendT").textContent = e ? `结局 · ${e.title}` : "全剧终";
  const hint = endingHint(got);
  $("gendS").textContent = n ? `已解锁 ${got.length}/${n} 个结局` +
    (hint ? "；" + hint : "") : "";
  $("gend").style.display = "flex";
}
function finishSimple(t) {
  localStorage.removeItem(SKEY()); $("btnCont").style.display = "none";
  $("gendT").textContent = t; $("gendS").textContent = "";
  $("gend").style.display = "flex";
}

function tap() {
  // 每次点击都是合法的用户手势: 顺手唤醒被 autoplay 策略拦下的 BGM
  if (bgm && bgm.paused && bgmOn && bgm.src) bgm.play().catch(() => {});
  if ($("gtitle").style.display !== "none" || $("gend").style.display === "flex") return;
  if (chapCardOn) { hideChapCard(); return; }     // 过场卡: 点一下提前进章
  next();
}
function restart() { $("gend").style.display = "none"; sav = fresh(); choosing = false; clearCast(); showChapCard(0, false); }
function toggleAuto() { autoOn = !autoOn; $("btnAuto").classList.toggle("on", autoOn); if (autoOn && !typing && !choosing) next(); }
function logAdd(b) {
  const d = document.createElement("div"); d.className = "l";
  d.innerHTML = (b.who ? `<b>${b.who === W.protagonist_id ? "你" : nameOf(b.who)}</b>` : "") +
                (b.text || "").replace(/</g, "&lt;");
  $("glog").appendChild(d);
}
function logPick(text) {
  const d = document.createElement("div"); d.className = "l pick";
  d.textContent = "▸ 你的选择：" + text;
  $("glog").appendChild(d);
}
function toggleLog() { const l = $("glog"); l.style.display = l.style.display === "block" ? "none" : "block"; l.scrollTop = l.scrollHeight; }
document.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); tap(); } });
boot();
</script>
