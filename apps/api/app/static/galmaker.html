<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎀 Galgame 生成器 · LinguisPlay</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0b0b12; color: #e7eaf3; font: 15px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 26px 18px 60px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .muted { color: #8b93a7; font-size: 13px; }
  .card { background: #14141f; border: 1px solid #2a2a3a; border-radius: 14px; padding: 16px; margin-top: 16px; }
  label { display: block; font-size: 13px; color: #aab2c4; margin: 12px 0 5px; }
  input, textarea, select { width: 100%; background: #0e0e16; color: #e7eaf3; border: 1px solid #34344a; border-radius: 9px; padding: 10px 12px; font: inherit; }
  textarea { min-height: 220px; resize: vertical; }
  button { background: #4a5adf; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 14px; }
  button.ghost { background: #232336; color: #9fb0ff; border: 1px solid #45456a; }
  button:disabled { opacity: .5; cursor: default; }
  .work { display: flex; gap: 12px; align-items: center; border-top: 1px dashed #2a2a3a; padding: 12px 0; }
  .work img { width: 54px; height: 96px; object-fit: cover; border-radius: 8px; background: #0e0e16; }
  .st { font-size: 12px; padding: 2px 9px; border-radius: 8px; background: #232336; }
  .st.ready { color: #7ddf9a; } .st.failed { color: #ff9d9d; } .st.building { color: #ffd479; }
  #prog { margin-top: 12px; font-size: 14px; }
  .bar { height: 8px; border-radius: 5px; background: #00000055; overflow: hidden; margin-top: 8px; }
  .bar span { display: block; height: 100%; width: 30%; border-radius: 5px; background: linear-gradient(90deg,#4a5adf,#8ea2ff); animation: slide 1.4s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
  a { color: #8ea2ff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪄 AI 剧本生成器 <a href="/gal" style="font-size:14px;font-weight:400;margin-left:10px">📚 我的书架</a>
    <a href="/studio" style="font-size:14px;font-weight:400;margin-left:6px">🛠 剧本工坊</a></h1>
  <div class="muted">贴一个故事或一个想法，AI 帮你起草：可以直接建成一部可玩的 galgame（识别角色、绘制立绘、编成可点剧本），也可以起草成引擎本草稿再进工坊精修（秘密门控、自由行动的真互动）。</div>

  <div class="card" id="form">
    <label>创作方式</label>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button class="ghost" id="tabA" onclick="setMode('text')">📄 我有全文</button>
      <button class="ghost" id="tabB" onclick="setMode('expand')">💡 我有想法</button>
      <button class="ghost" id="tabC" onclick="setMode('survey')">🎲 帮我想一个</button>
    </div>
    <label>做成什么</label>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button class="ghost" id="outGal" onclick="setOut('gal')">🎀 Galgame 成品本</button>
      <button class="ghost" id="outEngine" onclick="setOut('engine')">🧩 引擎本草稿</button>
    </div>
    <p class="muted" id="outHint" style="margin:2px 0 8px;font-size:12.5px">
      成品本：AI 全自动出可玩的选项式本子。引擎本：AI 起草角色/三幕/秘密，进工坊精修后可玩真互动（秘密门控、自由行动）。</p>
    <div id="titleRow">
    <label>作品标题</label>
    <input id="title" maxlength="24" placeholder="给你的 galgame 起个名字">
    </div>
    <div id="engineOnly" style="display:none">
      <label>演出语言</label>
      <select id="dLang">
        <option value="">自动（按素材文字判断）</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div id="paneA">
      <label>故事文本（≥200 字；越具体，人物和画面越准）</label>
      <textarea id="src" placeholder="把你的故事贴在这里——短篇小说、剧本、一段完整的情节都可以。"></textarea>
    </div>
    <!-- ✍️ 可保存问卷向导 (Yi 2026-08-02): 一屏一问、步步落库、拓写跟着答案走 -->
    <div id="paneC" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 2px">
        <span class="muted" id="wzStep" style="font-size:12px"></span>
        <span class="muted" id="wzSave" style="font-size:11.5px;color:#7ddf9a"></span>
      </div>
      <div id="wzBody" style="min-height:150px"></div>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="wzPrev" onclick="wzGo(-1)">‹ 上一步</button>
        <button id="wzNext" onclick="wzGo(1)">下一步 ›</button>
      </div>
    </div>
    <div id="paneB" style="display:none">
      <label>想法 / 梗概（两三句话就够）</label>
      <textarea id="idea" style="min-height:110px" placeholder="例：一个不会说谎的少女和一个只会说谎的少年，在广播社相遇……"></textarea>
      <button class="ghost" onclick="genOutline()">📑 生成章节大纲</button>
      <div id="outlineBox" style="display:none">
        <label>章节大纲（可以直接改，改完再拓写——拓写跑偏整本报废，这一关值得把好）</label>
        <div id="outlineList"></div>
      </div>
    </div>
    <div id="galOnly">
    <label>画风</label>
    <select id="style">
      <option value="">默认（电影质感写实）</option>
      <option value="日漫风格插画，清新明亮的色彩，干净的线条，赛璐璐上色，唯美光效">日漫清新</option>
      <option value="阴郁冷调的恐怖片美术，低饱和色，深重阴影，胶片噪点，令人不安的构图">暗黑惊悚</option>
      <option value="中国古风工笔画意，水墨氤氲，绢本设色，古典服饰与建筑，含蓄留白">古风水墨</option>
      <option value="赛博朋克霓虹夜色，雨湿街道反光，冷紫与青色光源，未来都市质感">赛博霓虹</option>
    </select>
    <label>文风（A档全文会自动从原文归纳；此处选择的优先）</label>
    <select id="wstyle">
      <option value="">自动归纳 / 默认</option>
      <option value="轻快的轻小说腔：短句多、对话密、吐槽有节奏。忌沉重长段；忌华丽辞藻">轻小说·轻快</option>
      <option value="细腻克制的纯文学腔：白描见情，留白多。忌直给情绪词；忌网络用语；忌滥用比喻">纯文学·细腻</option>
      <option value="热血直给的网文腔：节奏快、钩子密、情绪拉满。忌拖沓景物描写">网文·爽利</option>
      <option value="冷冽压抑的悬疑腔：短促、感官化、信息克制。忌解释过度；忌轻佻">悬疑·冷冽</option>
    </select>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="enrich" style="width:auto"> 🔎 联网补设定（同人/IP 题材推荐——搜集原作设定当编译铁律）
    </label>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="mature" style="width:auto"> 🔞 含成人内容（18+；成人片段以背景+文字呈现，不出立绘）
    </label>
    </div>
    <button id="go" onclick="build()">开始建造</button>
    <div id="prog" class="muted" style="display:none"></div>
  </div>

  <div class="card">
    <b style="font-size:14px">我的作品</b>
    <div id="mine" class="muted" style="margin-top:8px">加载中…</div>
  </div>
</div>
<script>
const API = "/api/v1";
async function j(path, opt = {}) {
  const r = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opt });
  if (!r.ok) { let d = {}; try { d = await r.json(); } catch (e) {} throw new Error(d.detail || r.status); }
  return r.json();
}
let pollTimer = null, MODE = "text";
const $id = x => document.getElementById(x);
function setMode(m) {
  MODE = m;
  $id("paneA").style.display = m === "text" ? "" : "none";
  $id("paneB").style.display = m === "expand" ? "" : "none";   // 问卷自带梗概站, 不再共用 B 档
  $id("paneC").style.display = m === "survey" ? "" : "none";
  // 问卷自带标题/画风/文风/🔞 与开建键 — 外层公用表单收起, 一屏只有一件事 (丝滑铁律)
  $id("titleRow").style.display = m === "survey" ? "none" : "";
  $id("go").style.display = m === "survey" ? "none" : "";
  $id("galOnly").style.display = (m !== "survey" && OUT === "gal") ? "" : "none";
  ["tabA", "tabB", "tabC"].forEach((t, i) =>
    $id(t).style.borderColor = ["text", "expand", "survey"][i] === m ? "#ffd479" : "#45456a");
  if (m === "survey") wzInit(new URLSearchParams(location.search).get("draft"));
}
// ── ✍️ 问卷向导 (可保存: 每一步 PATCH 落库, 关页/换设备回来接着答) ──────────
const ART = [["电影写实", ""],
  ["日漫清新", "日漫风格插画，清新明亮的色彩，干净的线条，赛璐璐上色，唯美光效"],
  ["暗黑惊悚", "阴郁冷调的恐怖片美术，低饱和色，深重阴影，胶片噪点，令人不安的构图"],
  ["古风水墨", "中国古风工笔画意，水墨氤氲，绢本设色，古典服饰与建筑，含蓄留白"],
  ["赛博霓虹", "赛博朋克霓虹夜色，雨湿街道反光，冷紫与青色光源，未来都市质感"]];
const WSTY = [["自动", ""],
  ["轻小说·轻快", "轻快的轻小说腔：短句多、对话密、吐槽有节奏。忌沉重长段；忌华丽辞藻"],
  ["纯文学·细腻", "细腻克制的纯文学腔：白描见情，留白多。忌直给情绪词；忌网络用语；忌滥用比喻"],
  ["网文·爽利", "热血直给的网文腔：节奏快、钩子密、情绪拉满。忌拖沓景物描写"],
  ["悬疑·冷冽", "冷冽压抑的悬疑腔：短促、感官化、信息克制。忌解释过度；忌轻佻"]];
const QS = [
  { k: "题材", q: "想要一个什么题材的故事？",
    chips: ["校园恋爱", "都市心动", "悬疑推理", "奇幻冒险", "科幻", "恐怖", "古风情缘"], free: "或自己写一个题材" },
  { k: "口味", q: "口味呢？", chips: ["甜", "甜中带虐", "虐", "黑深残"], mature: true },
  { k: "世界观", q: "用一句话形容这个世界（想不好可以跳过）", free: "例：雨永远下不停的港口小城", skip: true },
  { k: "主角性别与性格", q: "主角是个什么样的人？", free: "例：嘴硬心软的转学生（女）" },
  { k: "可攻略角色", q: "想攻略几位？各是什么类型？", chips: ["1位", "2位", "3位"],
    chipKey: "可攻略角色数", free: "例：毒舌学长 / 总在天台睡觉的神秘同级生" },
  { k: "篇幅", q: "篇幅与结局", chips: ["短篇·3章", "标准·4章", "长篇·5章"],
    chips2: ["2个结局", "3个结局"], chipKey2: "结局数" },
];
// ── 🏜 沙盒题集 (spec 2026-08-16): 主干6题 + 题材支线 (branch 按题材显隐, 纯前端) ──
// 🛡 完整转义器 (审查修复): area:true 的 textarea 是标签内容位, 属性级 &quot; 转义堵不住 </textarea><img onerror=...>
const _wzEsc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const MODEQ = { k: "造什么", q: "想造哪一种？",
  chips: ["🎀 选项式 galgame", "🏜 自由沙盒世界"] };
const SQS_ALL = [
  { k: "题材", q: "想要一个什么题材的世界？",
    chips: ["修仙", "都市异能", "西幻", "末世", "宫斗", "星际"], free: "或自己写一个题材" },
  { k: "世界观", q: "用几句话描述这个世界（越具体越像你想的那样）",
    free: "例：灵脉将枯的山城，三大宗门抢最后一口灵气", area: true },
  { k: "年代感", q: "年代感？", free: "例：1899 清末 / 三千年后的星港 / 盛唐", skip: true },
  { k: "超凡体系", q: "这个世界有超凡力量体系吗？叫什么？",
    chips: ["没有"], free: "例：斗气 / 灵力 / 军衔 / 血统位阶", skip: true },
  { k: "开局处境", q: "主角开局是什么处境？", free: "例：宗门大比前三天被逐出师门", skip: true },
  { k: "金手指", q: "给主角 0~4 条金手指（一行一条，40 字内）",
    free: "例：能看见他人头顶的死期", area: true, skip: true },
  { k: "分级", q: "尺度", chips: ["全年龄", "18+"] },
  { k: "境界命名风格", q: "境界名想要什么风格？", branch: "修仙",
    chips: ["古典雅致", "杀伐直白"], free: "或自己定几个", skip: true },
  { k: "宗门格局", q: "宗门格局？", branch: "修仙",
    free: "例：三大宗门鼎立，散修如蚁", skip: true },
  { k: "异能来源", q: "异能从哪来？", branch: "都市异能",
    chips: ["觉醒", "契约", "科技改造", "血脉"], skip: true },
  { k: "威胁类型", q: "末世的威胁是什么？", branch: "末世",
    chips: ["丧尸", "天灾", "外星文明", "人心"], free: "或自己写", skip: true },
  { k: "朝局", q: "眼下的朝局？", branch: "宫斗",
    free: "例：皇帝病重，两宫争储", skip: true },
];
const wzSandbox = () => (WD.answers["造什么"] || "").includes("沙盒");
function wzPages() {
  if (wzSandbox()) {
    const qs = SQS_ALL.filter(q => !q.branch || (WD.answers["题材"] || "") === q.branch);
    return [{ t: "q", q: MODEQ }, ...qs.map(q => ({ t: "q", q })),
            { t: "summary" }, { t: "sdone" }];
  }
  return [{ t: "q", q: MODEQ }, ...QS.map(q => ({ t: "q", q })),
          { t: "art" }, { t: "idea" }, { t: "outline" }, { t: "done" }];
}
let WD = null;   // {id, answers, step, idea, outline, art, wsty, mature, title}
let _wzT = null;
function wzSaveNow(extra) {
  if (!WD || !WD.id) return;
  clearTimeout(_wzT);
  _wzT = setTimeout(async () => {
    try {
      await j(`/gal/${WD.id}/survey`, { method: "PATCH", body: JSON.stringify(
        { answers: WD.answers, step: WD.step, idea: WD.idea || "",
          outline: WD.outline || [], ...(extra || {}) }) });
      $id("wzSave").textContent = "已保存 ✓";
      setTimeout(() => { if ($id("wzSave").textContent === "已保存 ✓") $id("wzSave").textContent = ""; }, 1800);
    } catch (e) { $id("wzSave").textContent = "⚠️ 没存上：" + e.message; }
  }, 350);
}
async function wzInit(draftId) {
  if (WD) { wzRender(); return; }
  try {
    const d = draftId ? await j(`/gal/${draftId}/survey`) : await j("/gal/draft", { method: "POST" });
    const sv = d.survey || {};
    WD = { id: d.id, answers: sv.answers || {}, step: +(sv.step || 0),
           idea: sv.idea || "", outline: sv.outline || [],
           art: sv.answers && sv.answers["画风"] || "电影写实",
           wsty: sv.answers && sv.answers["文风"] || "自动",
           mature: (sv.answers || {})["分级"] === "18+",
           title: d.title && d.title !== "未命名问卷" ? d.title : "" };
  } catch (e) {
    $id("wzBody").innerHTML = e.message === "401"
      ? '先去 <a href="/play">/play</a> 登录，问卷才能替你保存进度'
      : "⚠️ " + e.message;
    return;
  }
  // 老草稿迁移: 「造什么」是后加的第 0 题 — 答过题却没答它的老 gal 草稿顺移一格
  if (!WD.answers["造什么"] && WD.step > 0) {
    WD.answers["造什么"] = "🎀 选项式 galgame";
    WD.step += 1;
  }
  // 工坊「+新建沙盒剧本」直达 (?mode=sandbox): 第0题代答成沙盒, 直接落在题材题
  if (new URLSearchParams(location.search).get("mode") === "sandbox"
      && !WD.answers["造什么"]) {
    WD.answers["造什么"] = "🏜 自由沙盒世界";
    if (WD.step === 0) WD.step = 1;
    wzSaveNow();
  }
  wzRender();
}
const _chip = (word, on, click) =>
  `<button class="ghost" style="margin:4px 6px 0 0;padding:8px 14px${on ? ";border-color:#ffd479;color:#ffd479" : ""}" onclick="${click}">${word}</button>`;
function wzPick(k, v, adv) { WD.answers[k] = v; wzSaveNow(); adv ? wzGo(1) : wzRender(); }
function wzRender() {
  const pages = wzPages(), s = Math.min(WD.step, pages.length - 1), pg = pages[s];
  const body = $id("wzBody");
  WD.step = s;
  $id("wzPrev").style.visibility = s > 0 ? "visible" : "hidden";
  $id("wzStep").textContent = `第 ${s + 1} / ${pages.length} 步`;
  $id("wzNext").style.display = "";
  if (pg.t === "q") {
    const q = pg.q, a = WD.answers;
    let h = `<label style="font-size:15px;color:#e7eaf3;margin-top:14px">${q.q}</label>`;
    if (q.chips) h += "<div>" + q.chips.map(c =>
      _chip(c, a[q.chipKey || q.k] === c, `wzPick('${q.chipKey || q.k}','${c}',${!q.free && !q.chips2 && !q.mature})`)).join("") + "</div>";
    if (q.chips2) h += "<div>" + q.chips2.map(c =>
      _chip(c, a[q.chipKey2] === c, `wzPick('${q.chipKey2}','${c}',false)`)).join("") + "</div>";
    if (q.free) h += q.area
      ? `<textarea id="wzFree" maxlength="500" style="margin-top:10px;min-height:90px" placeholder="${q.free}">${_wzEsc(a[q.k] && !q.chips ? a[q.k] : (q.chips && a[q.k] && !q.chips.includes(a[q.k]) ? a[q.k] : ""))}</textarea>`
      : `<input id="wzFree" style="margin-top:10px" placeholder="${q.free}" value="${_wzEsc(a[q.k] && !q.chips ? a[q.k] : (q.chipKey && a[q.k]) || "")}">`;
    if (q.mature) h += `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:12px">
      <input type="checkbox" id="wzMature" style="width:auto" ${WD.mature ? "checked" : ""}> 🔞 含成人内容（18+）</label>`;
    body.innerHTML = h;
    $id("wzNext").textContent = q.skip && !(WD.answers[q.k] || "").trim() ? "跳过 ›" : "下一步 ›";
    const f = $id("wzFree");
    if (f && f.tagName === "INPUT") f.onkeydown = e => { if (e.key === "Enter") wzGo(1); };
  } else if (pg.t === "art") {
    body.innerHTML = `<label style="font-size:15px;color:#e7eaf3;margin-top:14px">画风</label><div>`
      + ART.map(([n]) => _chip(n, WD.art === n, `WD.art=WD.answers['画风']='${n}';wzSaveNow();wzRender()`)).join("") + `</div>
      <label style="font-size:15px;color:#e7eaf3;margin-top:14px">文风</label><div>`
      + WSTY.map(([n]) => _chip(n, WD.wsty === n, `WD.wsty=WD.answers['文风']='${n}';wzSaveNow();wzRender()`)).join("") + `</div>`;
  } else if (pg.t === "idea") {
    body.innerHTML = `<label style="font-size:15px;color:#e7eaf3;margin-top:14px">📜 故事梗概——按你的回答写的，可以直接改</label>
      <textarea id="wzIdea" style="min-height:150px">${WD.idea || ""}</textarea>
      <button class="ghost" onclick="wzIdeaGen()">✨ ${WD.idea ? "按答案重写一版" : "生成梗概"}</button>
      <span class="muted" id="wzIdeaMsg" style="font-size:12px;margin-left:8px"></span>`;
    if (!WD.idea) wzIdeaGen();
    $id("wzNext").textContent = "就按这个梗概 ›";
  } else if (pg.t === "summary") {
    body.innerHTML = `<label style="font-size:15px;color:#e7eaf3;margin-top:14px">🏔 世界概要——它是整个世界的地基，可以直接改</label>
      <textarea id="wzIdea" style="min-height:150px">${WD.idea || ""}</textarea>
      <button class="ghost" onclick="wzSummaryGen()">✨ ${WD.idea ? "按答案重铸一版" : "生成概要"}</button>
      <span class="muted" id="wzIdeaMsg" style="font-size:12px;margin-left:8px"></span>`;
    if (!WD.idea) wzSummaryGen();
    $id("wzNext").textContent = "就按这个概要 ›";
  } else if (pg.t === "outline") {
    const ol = WD.outline || [];
    body.innerHTML = `<label style="font-size:15px;color:#e7eaf3;margin-top:14px">📑 章节大纲——拓写跑偏整本报废，这一关值得把好</label>
      <div id="wzOl">${ol.map(x => `<input class="ol" style="margin-bottom:6px" value="${x.replace(/"/g, "&quot;")}">`).join("")}</div>
      <button class="ghost" onclick="wzOutlineGen()">📑 ${ol.length ? "重新生成大纲" : "生成大纲"}</button>
      <span class="muted" id="wzOlMsg" style="font-size:12px;margin-left:8px"></span>`;
    if (!ol.length) wzOutlineGen();
    $id("wzNext").textContent = "就按这个大纲 ›";
  } else if (pg.t === "sdone") {
    body.innerHTML = `<label style="font-size:15px;color:#e7eaf3;margin-top:14px">🏜 铸造</label>
      <div class="muted" style="font-size:12.5px;margin:4px 0 8px">${["题材", "年代感", "超凡体系"]
        .map(k => WD.answers[k] ? `${k}·${_wzEsc(WD.answers[k])}` : "").filter(Boolean).join("　")}${WD.answers["分级"] === "18+" ? "　🔞" : ""}</div>
      <label>世界名</label>
      <input id="wzTitle" maxlength="24" placeholder="给这个世界起个名字" value="${_wzEsc(WD.title || "")}">
      <div style="display:flex;gap:8px"><button onclick="wzSandboxBuild()">🏜 铸造这个世界</button></div>
      <div class="muted" style="font-size:12px;margin-top:6px">铸好先只有你能玩；玩得满意，去工坊发布并把可见性改公开就能上大厅。</div>`;
    $id("wzNext").style.display = "none";
  } else {   // done (gal 成书站, 原样)
    const a = WD.answers;
    body.innerHTML = `<label style="font-size:15px;color:#e7eaf3;margin-top:14px">🎬 成书</label>
      <div class="muted" style="font-size:12.5px;margin:4px 0 8px">${["题材", "口味", "篇幅", "结局数", "画风", "文风"]
        .map(k => a[k] ? `${k}·${a[k]}` : "").filter(Boolean).join("　")}${WD.mature ? "　🔞" : ""}</div>
      <label>作品标题</label>
      <input id="wzTitle" maxlength="24" placeholder="给它起个名字" value="${_wzEsc(WD.title || "")}">
      <div style="display:flex;gap:8px">
        <button onclick="wzBuild()">🎀 开始建造成品本</button>
        <button class="ghost" onclick="wzEngine()">🧩 转成引擎本草稿</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:6px">成品本：全自动出可玩的选项式 galgame。引擎本：进工坊精修，玩真互动。</div>`;
    $id("wzNext").style.display = "none";
  }
}
function wzCollectFree() {
  const pg = wzPages()[WD.step] || {};
  if (pg.t === "q") {
    const q = pg.q, f = $id("wzFree");
    if (f && f.value.trim()) WD.answers[q.k] = f.value.trim();
    const m = $id("wzMature"); if (m) { WD.mature = m.checked; WD.answers["分级"] = m.checked ? "18+" : "全年龄"; }
  }
  if (pg.t === "idea" || pg.t === "summary") { const t = $id("wzIdea"); if (t) WD.idea = t.value.trim(); }
  if (pg.t === "outline") WD.outline = [...document.querySelectorAll("#wzOl .ol")].map(i => i.value.trim()).filter(Boolean);
}
function wzGo(dir) {
  wzCollectFree();
  const pg = wzPages()[WD.step] || {};
  if (dir > 0 && pg.t === "idea" && (WD.idea || "").length < 50) {
    $id("wzIdeaMsg").textContent = "梗概还太短——先生成或多写两句"; return;
  }
  if (dir > 0 && pg.t === "summary" && (WD.idea || "").length < 50) {
    $id("wzIdeaMsg").textContent = "概要还太薄——它是整个世界的地基"; return;
  }
  if (dir > 0 && pg.t === "outline" && (WD.outline || []).length < 2) {
    $id("wzOlMsg").textContent = "至少要两章"; return;
  }
  WD.step = Math.max(0, Math.min(wzPages().length - 1, WD.step + dir));
  wzSaveNow();
  wzRender();
}
async function wzIdeaGen() {
  wzCollectFree();
  $id("wzIdeaMsg").textContent = "在写了…（十几秒）";
  try {
    const r = await j("/gal/survey", { method: "POST", body: JSON.stringify({ answers: WD.answers }) });
    WD.idea = r.idea; wzSaveNow(); wzRender();
  } catch (e) { $id("wzIdeaMsg").textContent = "⚠️ " + e.message; }
}
async function wzOutlineGen() {
  wzCollectFree();
  const n = (WD.answers["篇幅"] || "").includes("3") ? 3 : (WD.answers["篇幅"] || "").includes("5") ? 5 : 4;
  $id("wzOlMsg").textContent = "在排了…";
  try {
    const r = await j("/gal/outline", { method: "POST", body: JSON.stringify({ idea: WD.idea, n }) });
    if (r.title && !WD.title) WD.title = r.title;
    WD.outline = r.outline || []; wzSaveNow(); wzRender();
  } catch (e) { $id("wzOlMsg").textContent = "⚠️ " + e.message; }
}
async function wzSummaryGen() {
  wzCollectFree();
  $id("wzIdeaMsg").textContent = "在铸了…（十几秒）";
  try {
    const r = await j("/stories/draft_sandbox/summary", { method: "POST",
      body: JSON.stringify({ answers: WD.answers }) });
    WD.idea = r.summary; wzSaveNow(); wzRender();   // 概要住 survey.idea 槽 — 断点续答白送
  } catch (e) { $id("wzIdeaMsg").textContent = "⚠️ " + e.message; }
}
async function wzSandboxBuild() {
  wzCollectFree();
  WD.title = ($id("wzTitle") || {}).value || WD.title;
  try {
    const jb = await j("/stories/draft_sandbox", { method: "POST",
      body: JSON.stringify({ answers: WD.answers, summary: WD.idea || "", title: WD.title }) });
    $id("wzBody").innerHTML = `<div class="muted" style="margin-top:12px">🏜 世界铸造中…（世界→人物→修为体系→自检）</div>`;
    const t = setInterval(async () => {
      try {
        const r = await j(`/stories/draft_sandbox/${encodeURIComponent(jb.job)}`);
        if (r.status === "done") {
          clearInterval(t);
          $id("wzBody").innerHTML = `<div style="margin-top:12px">✅ 世界已经立起来了。
            <div style="display:flex;gap:8px;margin-top:10px">
              <button id="wzGoPlay">▶️ 立刻踏入</button>
              <button class="ghost" id="wzGoStudio">🛠 先去工坊看看</button>
            </div>
            <div class="muted" style="font-size:12px;margin-top:6px">现在只有你能玩。满意了去工坊发布并把可见性改公开，就能上大厅。</div></div>`;
          // 🛡 story_id 不裸拼进 onclick 字符串 (审查修复): 属性赋值走 encodeURIComponent
          $id("wzGoPlay").onclick = () => location.href = "/play?story=" + encodeURIComponent(r.story_id);
          $id("wzGoStudio").onclick = () => location.href = "/studio?story=" + encodeURIComponent(r.story_id);
        } else if (r.status === "error" || r.status === "gone") {
          clearInterval(t); alert("⚠️ " + (r.error || "任务丢了，重试一次")); wzRender();
        }
      } catch (e) { clearInterval(t); alert("⚠️ " + e.message); wzRender(); }
    }, 2500);
  } catch (e) { alert("⚠️ " + e.message); }
}
async function wzBuild() {
  wzCollectFree();
  WD.title = ($id("wzTitle") || {}).value || WD.title;
  const art = (ART.find(([n]) => n === WD.art) || [])[1] || "";
  const wst = (WSTY.find(([n]) => n === WD.wsty) || [])[1] || "";
  try {
    const w = await j(`/gal/${WD.id}/build_from_survey`, { method: "POST", body: JSON.stringify(
      { title: WD.title, art_style: art, style: wst, mature: WD.mature,
        idea: WD.idea, outline: WD.outline }) });
    $id("wzBody").innerHTML = `<div class="muted" style="margin-top:12px">🎬 开拍了——下面看进度。</div>`;
    poll(w.id);
  } catch (e) { alert("⚠️ " + e.message); }
}
async function wzEngine() {
  wzCollectFree();
  const go = $id("wzNext");
  try {
    const jb = await j("/stories/draft_engine", { method: "POST",
      body: JSON.stringify({ text: WD.idea, title: ($id("wzTitle") || {}).value || WD.title, language: "" }) });
    $id("wzBody").innerHTML = `<div class="muted" style="margin-top:12px">🧩 AI 起草中…（角色→三幕→秘密→自检）</div>`;
    const t = setInterval(async () => {
      try {
        const r = await j(`/stories/draft_engine/${jb.job}`);
        if (r.status === "done") { clearInterval(t); location.href = `/studio?story=${r.story_id}`; }
        else if (r.status === "error") { clearInterval(t); alert("⚠️ " + r.error); wzRender(); }
      } catch (e) { clearInterval(t); alert("⚠️ " + e.message); wzRender(); }
    }, 2500);
  } catch (e) { alert("⚠️ " + e.message); }
}
async function genOutline() {
  const idea = $id("idea").value.trim();
  if (idea.length < 20) { alert("想法再写两句——题材、主角、想要什么样的故事"); return; }
  try {
    const r = await j("/gal/outline", { method: "POST", body: JSON.stringify({ idea, n: 4 }) });
    if (r.title && !$id("title").value.trim()) $id("title").value = r.title;
    $id("outlineList").innerHTML = r.outline.map(x =>
      `<input class="ol" style="margin-bottom:6px" value="${x.replace(/"/g, "&quot;")}">`).join("");
    $id("outlineBox").style.display = "";
  } catch (e) { alert("⚠️ " + e.message); }
}
// ✍️ 成品类型 (创作 UX 首期 A): gal 全自动成品 vs 引擎本草稿→工坊精修
let OUT = "gal";
function setOut(o){
  OUT = o;
  document.getElementById("outGal").style.borderColor = o==="gal" ? "#8ea2ff" : "";
  document.getElementById("outEngine").style.borderColor = o==="engine" ? "#8ea2ff" : "";
  // 引擎本用不上 gal 专属项 (画风/文风/配图/18+) — 藏起来别误导; 问卷模式自带这些
  document.getElementById("galOnly").style.display = (o==="gal" && MODE!=="survey") ? "" : "none";
  // 演出语言只有引擎本认 (gal 成品管线写死转写中文) — 同理只在引擎本露出
  document.getElementById("engineOnly").style.display = o==="engine" ? "" : "none";
  document.getElementById("go").textContent = o==="gal" ? "开始建造" : "开始起草（完成后进工坊精修）";
}
setOut("gal");
// ?draft=xx → 直达问卷续答 (书架「继续创作」的落点)
if (new URLSearchParams(location.search).get("draft")) setMode("survey");
// ?mode=sandbox → 直达沙盒问卷 (工坊「+新建沙盒剧本」的落点, 第0题在 wzInit 里代答)
else if (new URLSearchParams(location.search).get("mode") === "sandbox") setMode("survey");
async function build() {
  const go = document.getElementById("go");
  if (OUT === "engine") {   // 🧩 引擎本草稿: 走 /stories/draft_engine, 完成跳工坊
    const text = MODE === "text" ? $id("src").value.trim() : $id("idea").value.trim();
    if (text.length < 10) { alert("多给一点素材：想法几句话，或整段原文"); return; }
    go.disabled = true; go.textContent = "AI 起草中…（角色→三幕→秘密→自检）";
    try {
      const jb = await j("/stories/draft_engine", { method: "POST",
        body: JSON.stringify({ text, title: $id("title").value.trim(),
                               language: $id("dLang").value }) });
      const t = setInterval(async () => {
        try {
          const r = await j(`/stories/draft_engine/${jb.job}`);
          if (r.status === "done") { clearInterval(t); location.href = `/studio?story=${r.story_id}`; }
          else if (r.status === "error") { clearInterval(t); alert("⚠️ " + r.error); go.disabled = false; go.textContent = "开始建造"; }
        } catch (e) { clearInterval(t); alert("⚠️ " + e.message); go.disabled = false; go.textContent = "开始建造"; }
      }, 2500);
    } catch (e) { alert("⚠️ " + e.message); go.disabled = false; go.textContent = "开始建造"; }
    return;
  }
  const body = { title: $id("title").value.trim(),
                 art_style: $id("style").value,
                 style: $id("wstyle").value,
                 enrich: $id("enrich").checked,
                 mature: $id("mature").checked };
  if (MODE === "text") body.source_text = $id("src").value;
  else {
    body.mode = "expand";
    body.idea = $id("idea").value.trim();
    body.outline = [...document.querySelectorAll("#outlineList .ol")]
      .map(i => i.value.trim()).filter(Boolean);
    if (body.outline.length < 2) { alert("先生成并确认章节大纲"); return; }
  }
  go.disabled = true;
  try {
    const w = await j("/gal", { method: "POST", body: JSON.stringify(body) });
    poll(w.id);
  } catch (e) { alert("⚠️ " + e.message); go.disabled = false; }
}
// 建造进度页: the stage checklist — 识别 → 编剧 → 美术, live step under the active one
const STAGES = [["expanding", "按大纲拓写全文"], ["parsing", "识别角色与场景"],
                ["compiling", "编写章节与结局"], ["art", "绘制立绘与背景"]];
function stagesHTML(status, progress) {
  const order = { queued: -1, expanding: 0, parsing: 1, compiling: 2, art: 3 };
  const cur = (status in order) ? order[status] : -1;
  return STAGES.map(([k, label], i) =>
    `<div>${i < cur ? "✅" : i === cur ? "⏳" : "○"} ${label}` +
    (i === cur ? `<div class="muted" style="margin-left:22px">${progress || ""}</div>` : "") +
    `</div>`).join("") + `<div class="bar"><span></span></div>`;
}
function poll(id) {
  const prog = document.getElementById("prog");
  prog.style.display = "block";
  prog.innerHTML = stagesHTML("queued", "排队中…");
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const st = await j(`/gal/${id}/status`);
      if (st.status === "ready") {
        clearInterval(pollTimer);
        prog.innerHTML = `✅ 建造完成！ <a href="/galplay?work=${id}">▶ 开始游玩</a>`
          + (st.missing && st.missing.length ? `<div class="muted">缺 ${st.missing.length} 张图，可在下方作品列表重跑补齐</div>` : "");
        document.getElementById("go").disabled = false;
        loadMine();
      } else if (st.status === "failed") {
        clearInterval(pollTimer);
        prog.innerHTML = `❌ ${st.progress}　<a href="javascript:rebuild('${id}')">重试</a>`;
        document.getElementById("go").disabled = false;
        loadMine();
      } else {
        prog.innerHTML = stagesHTML(st.status, st.progress);
      }
    } catch (e) {}
  }, 3000);
}
async function rebuild(id) {
  try { await j(`/gal/${id}/rebuild`, { method: "POST" }); poll(id); }
  catch (e) { alert("⚠️ " + e.message); }
}
async function loadMine() {
  const el = document.getElementById("mine");
  try {
    const rows = await j("/gal/mine");
    if (!rows.length) { el.textContent = "还没有作品。上面贴一个故事试试。"; return; }
    el.innerHTML = rows.map(w => {
      const cls = w.status === "ready" ? "ready" : w.status === "failed" ? "failed" : "building";
      const lab = { ready: "已完成", failed: "失败", survey: "✍️ 问卷草稿" }[w.status] || "建造中";
      return `<div class="work">${w.cover ? `<img src="${w.cover}">` : `<img>`}
        <div style="flex:1"><b>${w.title}</b><div class="muted">${w.progress || ""}</div></div>
        <span class="st ${cls}">${lab}</span>
        ${w.status === "ready" ? `<a href="/galplay?work=${w.id}">▶ 游玩</a>` : ""}
        ${w.status === "survey" ? `<a href="/maker?draft=${w.id}" onclick="setMode('survey');return false">✍️ 继续创作</a>` : ""}
        ${w.status !== "ready" && w.status !== "failed" && w.status !== "survey" ? `<a href="javascript:poll('${w.id}')">进度</a>` : ""}
        ${w.status === "failed" || w.status === "ready" ? `<a href="javascript:rebuild('${w.id}')" title="补齐缺图/重试">↻</a>` : ""}
      </div>`;
    }).join("");
  } catch (e) {
    el.innerHTML = e.message === "401" ? `请先去 <a href="/play">/play</a> 登录，再回到这里` : "加载失败";
  }
}
loadMine();
</script>
</body>
</html>
