services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linguisplay
      POSTGRES_PASSWORD: linguisplay
      POSTGRES_DB: linguisplay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguisplay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
